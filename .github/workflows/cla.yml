name: CLA

# Contributors sign CLA.md by commenting on their pull request.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >
      (github.event.comment.body == 'recheck'
       || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/mhus/vance/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: mhus,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thank you for your contribution. Before we can merge it, please read the
            [Contributor License Agreement](https://github.com/mhus/vance/blob/main/CLA.md)
            and sign it by posting the comment below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
