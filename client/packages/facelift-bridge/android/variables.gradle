ext {
    // 23 (not Capacitor's default 22): androidx.biometric 1.1.0 and the
    // WebView Profile API used by @vance/facelift-account-webview require
    // API 23+ (manifest merger fails below that).
    minSdkVersion = 23
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    // 1.12.1 (not Capacitor's default 1.9.0): matures the WebView Profile
    // API (per-account cookie/storage isolation) the account-webview
    // plugin relies on. Inherited by the plugin module via rootProject.ext.
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}