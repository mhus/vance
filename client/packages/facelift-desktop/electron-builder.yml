appId: de.mhus.vance.facelift.desktop
productName: Vancetope
directories:
  output: release
# The Electron main/preload are compiled into dist/. The renderer is the
# facelift-bridge web build, bundled from the sibling package into the app
# resources under `renderer/` (main.ts loads it from resourcesPath in the
# packaged app). Build the bridge first: `pnpm --filter @vance/facelift-bridge build`.
files:
  - dist/**
extraResources:
  - from: ../facelift-bridge/dist
    to: renderer
mac:
  category: public.app-category.productivity
  # build/icon.icns — generated from the Vancetope app icon
  # (facelift-bridge iOS AppIcon 1024px) via iconutil.
  icon: build/icon.icns
  # Notarization prerequisites for Developer-ID (non-MAS) distribution.
  # hardenedRuntime + these entitlements are harmless for unsigned local
  # builds; signing + notarization only kick in when a Developer ID cert
  # is in the keychain (or CSC_LINK) AND APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD
  # / APPLE_TEAM_ID are set — otherwise electron-builder skips both and the
  # local `dist:mac` still produces an (unsigned) app.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Deterministic per-arch artifact names (electron-builder otherwise drops the
  # arch suffix for x64): Vancetope-<version>-arm64.dmg / -x64.dmg. The cask's
  # #{arch} interpolation depends on this.
  artifactName: ${productName}-${version}-${arch}.${ext}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Utility
