<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Vancetope</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="popup">
    <div id="status" class="note hidden">
      <span id="status-text"></span>
      <!-- Revealed only for errors the person can actually fix here. A button
           that is always there would train people to ignore it. -->
      <button id="status-action" class="hidden">
        Open settings
      </button>
      <!-- Shown after a grab: the document it produced. A link rather than an
           automatic tab, so saving three pages in a row does not open three
           tabs behind you. -->
      <button id="status-open" class="hidden">
        Open document
      </button>
    </div>

    <!-- No connection yet -->
    <section id="unconfigured" class="hidden">
      <p class="muted">
        This extension is not connected to a link list yet. Open a links app in
        Vancetope, press ⚙, create a capture token and paste the connection
        string here.
      </p>
      <button id="open-options" class="primary">Open settings</button>
    </section>

    <!-- The page cannot be saved (chrome://, a file, the new-tab page) -->
    <section id="unsupported" class="hidden">
      <p class="muted">There is no web page to save on this tab.</p>
    </section>

    <!-- The form -->
    <section id="form" class="hidden">
      <!-- Which destination this save goes to. Hidden with one connection
           configured: a picker with a single choice is furniture.

           A select rather than a tab strip. Tabs imply loaded contents, and
           each destination's contents are a lookup against a different brain —
           so a strip would either ask every configured brain what page you are
           on each time the popup opens, or be a picker that costs more width.
           At 340px it also stops working past four entries. -->
      <label id="target-row" class="hidden">
        <span>Save to</span>
        <select id="target"></select>
      </label>
      <label>
        <span>Title</span>
        <input id="title" type="text" />
      </label>
      <label>
        <span>Group</span>
        <select id="group"></select>
      </label>
      <label>
        <span>Note (optional)</span>
        <input id="note" type="text" placeholder="Why you kept it" />
      </label>
      <div class="row">
        <button id="save" class="primary grow">Save link</button>
        <button id="grab" title="Import the page itself as a document">Save page</button>
      </div>
      <div class="row" style="margin-top: 8px">
        <p id="url" class="muted truncate grow"></p>
        <!-- The only way to reach the settings from a configured popup. Without
             it the grab folder and a re-paste are reachable solely through the
             browser's own context menu, which is not somewhere people look. -->
        <!-- Opening the list is a plain link into the web UI, not an API
             call: it rides the person's own session. -->
        <button id="open-list" class="muted" style="border: 0; padding: 0"
                title="Open this link list in Vancetope">↗</button>
        <button id="settings" class="muted" style="border: 0; padding: 0">⚙</button>
      </div>
    </section>
  </body>
  <script type="module" src="./popup.ts"></script>
</html>
