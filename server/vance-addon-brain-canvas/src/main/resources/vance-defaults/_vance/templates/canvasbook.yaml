title:       { de: "Canvas-App",  en: "Canvas app" }
description: { de: "Eine neue Canvasbook-App — Sammlung räumlicher Canvas-Boards. Seiten fügst du danach im Editor hinzu.",
               en: "A new canvasbook app — a collection of spatial canvas boards. Add boards afterwards in the editor." }
icon: squares-2x2
tags: [app, canvas]

# `app:` routes this template through CanvasbookApplication.create — the same
# entry point canvasbook_app_create uses — so the surface way and the tool way
# produce the same folder. The folder is chosen by the user; boards
# (*.canvas.yaml) are added by the canvas editor / canvasbook_page_create
# afterwards.
app: canvasbook

fields:
  - name: title
    type: string
    required: true
    label: { de: "Titel",        en: "Title" }
  - name: description
    type: textarea
    rows: 2
    label: { de: "Beschreibung", en: "Description" }
