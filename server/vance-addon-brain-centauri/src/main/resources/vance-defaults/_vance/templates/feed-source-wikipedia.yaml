title:       { de: "Feed-Quelle: Wikipedia",  en: "Feed source: Wikipedia" }
description: { de: "Letzte Änderungen einer Wikipedia-Sprachausgabe. Kein Konto, kein Key.",
               en: "Recent changes of one Wikipedia language edition. No account, no key." }
