id: contacts
version: "@project.version@"

# Landing tile -> addon.html?addon=contacts mounts the ./area expose: the
# address book a person manages by hand (user, project and tenant contacts).
tile:
  label: Contacts
  description: People, organisations and groups — your own, the project's and the tenant's.

# Document-kind ids this addon's ./register expose contributes. The Web-UI
# reads these to decide WHICH remote to fetch when a document of that kind
# is opened -- a load trigger, not a copy of the matching rule.
kinds:
  - contact
