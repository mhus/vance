title:       { de: "Links",  en: "Links" }
description: { de: "Eine Link-Sammlung — externe URLs als gruppierte Vorschau-Karten. Titel, Teaser und Bild holt das System von der verlinkten Seite; eigene Texte überschreiben sie.",
               en: "A link collection — external URLs as grouped preview cards. Title, teaser and picture come from the linked page; your own text overrides them." }
icon: link
tags: [app, links]

# `app:` routes this template through LinksApplication.create — the same entry
# point links_app_create uses — so the manifest is serialised by the codec
# rather than typed out here. The folder is chosen by the user; links and
# groups are created afterwards in the app (paste field + "New group") or by
# the chat agent via links_entry_add — so this form stays at the two fields
# that have no other home.
app: links

fields:
  - name: title
    type: string
    required: true
    label: { de: "Titel",        en: "Title" }
  - name: description
    type: textarea
    rows: 2
    label: { de: "Beschreibung", en: "Description" }
