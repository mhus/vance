# Nutrimat loop-lab experiment: nature `absint` — the stop with the
# mandatory self-accounting. At every natural-stop candidate a LightLlm call
# must produce a non-empty report of what this loop did; the report is
# appended to the persisted loop state and notified to the client. Exactly
# one axis away from `salitos` (report instead of verdict). See
# specification/public/nutrimat-engine.md.
title: "Nutrimat absint — stop with mandatory round report"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `absint` runs the same natural-stop
  tool loop as `janx`/`salitos`, and like `salitos` it fires one cheap LLM
  call at every natural stop — but the call decides nothing: it must
  produce a non-empty account of what this loop did (recipe
  `nutrimat-judge-absint`). The report is recorded in the process's loop
  state (`nutrimatState.roundReports`, appended like the turn counter) and
  pushed to the client as a notification. The comparison `salitos` vs.
  `absint` measures exactly that framing — verdict vs. account.
engine: nutrimat-absint
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Applies when this recipe runs as the
# session chat; worker echoes in other sessions inherit that session's
# theme. Pure UI metadata, never read by spawn or engine logic. See
# specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  # Degraded-but-available fallback: if the analyze-tier model is broken
  # at the provider (404/rate-limit/5xx), retry on the fast tier rather
  # than failing the whole turn (live fund 2026-10-04: 'All 1 chat-model
  # chain entries exhausted' killed every turn after exhausted).
  fallbackModels:
    - default:fast
tags:
  - nutrimat
  - experimental
