# Nutrimat loop-lab experiment: nature `affogato` — an external critic
# attacks the answer at every stop until it accepts. See
# specification/public/nutrimat-engine.md.
title: "Nutrimat affogato — an external critic attacks the answer"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `affogato` lets the model call
  tools as long as it wants; when it stops, its draft goes to a critic
  first. The critic sees the request, the draft and the tool work (which
  tools ran, what they returned) and either accepts the draft or sends
  it back with a critique — the model then revises, and may call tools
  again. Every verdict is published to the loop state and the client.
  The comparison `affogato` vs. `salitos` measures an external adversary
  against the loop's own done/continue decision.
engine: nutrimat-affogato
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Pure UI metadata, never read by spawn
# or engine logic. See specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  fallbackModels:
    - default:fast
  # Critic rounds per turn; once spent, the next draft is accepted
  # without a critique. 0 = unlimited.
  maxCritiques: 3
tags:
  - nutrimat
  - experimental
