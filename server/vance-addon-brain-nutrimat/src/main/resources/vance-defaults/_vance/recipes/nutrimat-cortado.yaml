# Nutrimat loop-lab experiment: nature `cortado` — salitos' decision, made
# through a mandatory loop_decide tool instead of a JSON message. See
# specification/public/nutrimat-engine.md.
title: "Nutrimat cortado — the loop decides through a tool"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `cortado` lets the model call
  tools as long as it wants, but it ends (or continues) only by calling
  its own loop-control tool `loop_decide` — done true/false, a reason,
  and the answer when done. A plain message without a tool call is not
  accepted. No round or decision cap — endless by design, every decision
  is published to the loop state and the client. The comparison
  `cortado` vs. `salitos` measures whether the form of the protocol
  (tool call vs. JSON text) changes the decision.
engine: nutrimat-cortado
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Pure UI metadata, never read by spawn
# or engine logic. See specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  fallbackModels:
    - default:fast
tags:
  - nutrimat
  - experimental
