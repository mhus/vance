# Nutrimat loop-lab experiment: nature `espresso` — plan first: a
# tool-less planning round, then step-by-step execution against the plan.
# See specification/public/nutrimat-engine.md.
title: "Nutrimat espresso — plan first, then execute"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `espresso` makes the model plan
  before it acts: the first round has no tools and must produce a short
  numbered plan, which stays in the context and is published to the loop
  state. Then the model executes the plan in the natural-stop tool loop,
  announcing each step (`STEP n:`) and any change (`PLAN REVISED:`); the
  first message without a tool call is the answer. The comparison
  `janx` vs. `espresso` measures whether planning up front pays off on
  multi-step tasks — and what it costs on short ones.
engine: nutrimat-espresso
# Chat look for sessions on this recipe: the shared "this is an
# experiment" theme (_vance/chat-themes/nutrimat.css). Pure UI metadata,
# never read by spawn or engine logic. See
# specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  # Degraded-but-available fallback: retry on the fast tier when the
  # analyze-tier model is broken at the provider.
  fallbackModels:
    - default:fast
  # Opt-in round cap (planning round included); 0 = no cap. espresso has
  # no other net — set one per experiment if a model may loop forever.
  maxIterations: 0
tags:
  - nutrimat
  - experimental
