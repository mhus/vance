# Nutrimat loop-lab experiment: nature `janx` — the reference
# implementation: the Ford worker loop (copied, not linked) owning its
# loop entirely. See specification/public/nutrimat-engine.md.
title: "Nutrimat janx — the Ford worker loop (reference)"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `janx` is the reference loop of the
  Nutrimat laboratory: the Ford worker loop — the model calls tools as
  long as it wants, the first message without a tool call IS the reply,
  no routine round cap. Safety nets catch a stuck loop (the same tool
  call repeating, an empty reply, a failed model call, a per-turn time
  limit); a worker that hits one reports the failure and closes, a chat
  stops with a "continue" offer. Use it as the baseline in A/B
  comparisons against the other Nutrimat natures, or as an ordinary
  worker.
engine: nutrimat-janx
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Applies when this recipe runs as the
# session chat; worker echoes in other sessions inherit that session's
# theme. Pure UI metadata, never read by spawn or engine logic. See
# specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  # Degraded-but-available fallback: if the analyze-tier model is broken
  # at the provider (404/rate-limit/5xx), retry on the fast tier rather
  # than failing the whole turn (live fund 2026-10-04: 'All 1 chat-model
  # chain entries exhausted' killed every turn after exhausted).
  fallbackModels:
    - default:fast
tags:
  - nutrimat
  - experimental