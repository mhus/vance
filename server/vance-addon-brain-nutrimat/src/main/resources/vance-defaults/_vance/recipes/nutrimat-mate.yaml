# Nutrimat loop-lab experiment: nature `mate` — the exhausted loop with a
# judge. At budget exhaustion a LightLlm judge decides: fresh budget and
# keep going ("extend"), or synthesize the answer. Exactly one axis away
# from `redbull`. See specification/public/nutrimat-engine.md.
title: "Nutrimat mate — exhausted loop with judge"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `mate` runs the same natural-stop
  tool loop as `janx`/`redbull`, but when the iteration budget runs out,
  a judge (a single cheap LLM call, recipe `nutrimat-judge-mate`)
  decides whether the loop earned a fresh budget and should keep going,
  or whether the answer gets synthesized from what has been gathered.
  The comparison `redbull` vs. `mate` measures exactly the judge. The
  smaller `maxIterations` here is deliberate — the judge only fires at
  exhaustion; tune it per experiment.
engine: nutrimat-mate
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Applies when this recipe runs as the
# session chat; worker echoes in other sessions inherit that session's
# theme. Pure UI metadata, never read by spawn or engine logic. See
# specification/public/chat-themes.md.
webTheme: nutrimat
params:
  model: default:analyze,default:fast
  # Smaller than janx's 40 on purpose: the judge only speaks when the
  # budget is exhausted. Raise it for harder tasks, lower it to see the
  # judge sooner. Runtime-tunable via `//nutrimat set maxturns <n>`.
  maxIterations: 12
tags:
  - nutrimat
  - experimental