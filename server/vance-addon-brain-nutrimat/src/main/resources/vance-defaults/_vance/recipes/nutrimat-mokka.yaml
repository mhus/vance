# Nutrimat loop-lab experiment: nature `mokka` — predict before acting:
# every tool call states its expected result (EXPECT), the next message
# scores it (MATCH yes/no); a miss streak forces a tool-less reflection.
# See specification/public/nutrimat-engine.md.
title: "Nutrimat mokka — predict before acting"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `mokka` lets the model call tools
  as long as it wants, but every tool call must state what the model
  expects the result to show, and the next message must say whether the
  result matched. The model scores itself; the loop counts hits and
  misses. A streak of misses means the model's picture of the situation
  is wrong: the loop forces a reflection round without tools. The
  prediction tally is recorded in the loop state at the stop. The first
  message without a tool call is the answer.
engine: nutrimat-mokka
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Applies when this recipe runs as the
# session chat; worker echoes in other sessions inherit that session's
# theme. Pure UI metadata, never read by spawn or engine logic. See
# specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  # Degraded-but-available fallback: if the analyze-tier model is broken
  # at the provider (404/rate-limit/5xx), retry on the fast tier rather
  # than failing the whole turn.
  fallbackModels:
    - default:fast
  # Misses in a row that force the tool-less reflection round.
  mismatchThreshold: 2
  # Per-turn wallclock net (minutes) — the generous last resort; an
  # opt-in round cap is params.maxIterations (absent = no cap).
  maxWallclockMinutes: 60
tags:
  - nutrimat
  - experimental
