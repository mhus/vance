# Nutrimat loop-lab experiment: nature `redbull` — the hard-budget loop.
# Exhaustion is an error (the `exhausted` exception), nothing else: no
# judge, no continuation, no partial-work rescue. Exactly one axis away
# from `janx`. See specification/public/nutrimat-engine.md.
title: "Nutrimat redbull — hard budget, exhausted is an error"
listed: true
category: experimental
description: |
  Experimental loop-lab worker. Nature `redbull` runs the same
  natural-stop tool loop as `janx`, but its budget is hard: when the
  iteration budget runs out, the loop raises the `exhausted` error and
  the turn ends as a visible failure — no judge, no continuation, no
  best-partial-work rescue. The comparison `janx` vs. `redbull`
  measures exactly that difference. Pick it when you want an honest
  "couldn't finish" instead of a rescued partial answer.
engine: nutrimat-redbull
# Chat look for sessions on this recipe: warm red transcript with the
# exclamation-mark frieze (_vance/chat-themes/nutrimat.css) — the shared
# "this is an experiment" signal. Applies when this recipe runs as the
# session chat; worker echoes in other sessions inherit that session's
# theme. Pure UI metadata, never read by spawn or engine logic. See
# specification/public/chat-themes.md.
webTheme: nutrimat
params:
  # Primary on the analyze tier. The comma form is an alias-resolution
  # cascade (first DEFINED alias wins), NOT a runtime fallback — the
  # chain fallback is the list below, same convention as ford.yaml.
  model: default:analyze,default:fast
  # Degraded-but-available fallback: if the analyze-tier model is broken
  # at the provider (404/rate-limit/5xx), retry on the fast tier rather
  # than failing the whole turn (live fund 2026-10-04: 'All 1 chat-model
  # chain entries exhausted' killed every turn after exhausted).
  fallbackModels:
    - default:fast
  # Hard budget: smaller than janx's 40 — exhaustion is the point of this
  # nature, so the error should be reachable on real tasks. Tune per experiment.
  maxIterations: 12
tags:
  - nutrimat
  - experimental