$meta:
  kind: application
  app: search
# Single-quoted YAML with ' doubled: user text reaches this file verbatim, and a
# title containing a quote or a backslash must not be able to break the manifest.
title: '{{ title | replace({"'": "''"}) }}'
{% if description %}description: '{{ description | replace({"'": "''"}) }}'{% endif %}
search:
  defaultModality: '{{ defaultModality | default("web") | replace({"'": "''"}) }}'
  # Unquoted on purpose — an integer position. The form field is typed
  # `integer`, so nothing but a number can reach it.
  defaultNum: {{ defaultNum | default(10) }}
