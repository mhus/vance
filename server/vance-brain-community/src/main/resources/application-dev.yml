server:
  port: 9991

# Local dev profile of the community (single-node) edition, active through
# `wb dev brain` (--spring.profiles.active=dev). It lives in this bundle, not in
# vance-brain, so no production artifact carries these throwaway defaults.
#
# Redis stays off (the `vance.redis.enabled` default): with one node every
# live feature is pod-local anyway. The cloud edition's dev profile
# (vance-ee-brain-cloud-app) turns it on.
vance:
  language:
    # Dev default: German. Assistant + content default to 'de' when no
    # chat.language / content.language scope setting picks a language
    # (see application.yml for the property doc).
    default: de
  encryption:
    # Local IDE/dev default so this profile boots without setting
    # VANCE_ENCRYPTION_PASSWORD. Deliberately NOT "changeit" (the service
    # rejects that publicly-known key); production application.yml carries
    # no default and fails fast if the env var is unset (code-review F4).
    password: ${VANCE_ENCRYPTION_PASSWORD:vance-local-dev}
  internal:
    # Throwaway dev value for the /internal/** secret — application.yml
    # ships no default (a known shared secret would authenticate anyone
    # against any deployment that never set the variable).
    token: ${VANCE_INTERNAL_TOKEN:vance-local-dev-internal}
  web:
    # The face dev server paired with this brain (`pnpm dev:1`, FACE_PORT
    # 9901). The OAuth server builds issuer and resource URLs from this, and
    # sends login/consent redirects there — it must be the URL the browser
    # and MCP clients actually use.
    public-base-url: ${VANCE_WEB_PUBLICBASEURL:http://localhost:9901}

logging:
  file:
    name: vance-brain.log
  level:
    de.mhus.vance: TRACE
