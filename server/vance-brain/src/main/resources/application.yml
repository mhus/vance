spring:
  application:
    name: vance-brain
  mongodb: # since spring 7: spring.mongodb.*
    uri: mongodb://root:example@localhost:27017/vance?authSource=admin
    database: vance
  data:
    mongodb:
      # Make Spring Data MongoDB honour @Indexed / @CompoundIndex /
      # @TextIndexed annotations on entity classes. Without this flag,
      # the annotations are dead decoration and the only index on every
      # collection is _id — search queries against the @TextIndexed
      # fields (session-search, etc.) fail with IndexNotFound, and
      # hot-path lookups by tenantId+sessionId run as collection scans.
      auto-index-creation: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    # Jackson 3 (Spring Boot 4) flips FAIL_ON_NULL_FOR_PRIMITIVES on by
    # default — Jackson 2 had it off. Several DTOs (e.g. AccessTokenRequest
    # with its boolean primitives) were written under the Jackson-2
    # assumption and JSON bodies sending {"requestRefreshToken": null}
    # now trigger HTTP 400. Restoring the previous default keeps
    # existing clients working.
    deserialization:
      fail-on-null-for-primitives: false

  web:
    error:
      # Include the exception message in the JSON error response so the
      # Web-UI (and curl) can show a useful message instead of the bare
      # "Bad Request". Spring's default `never` keeps it out, which makes
      # 400-class errors from `ResponseStatusException` (e.g. Setting-Form
      # validation, scope-resolution failures) opaque on the client.
      # Stacktraces stay off — internal exception types stay internal.
      #
      # Boot 4 moved this from server.error.* and ignores the old path
      # without a word — it sat there dead, which is why refusals had been
      # arriving as bare statuses.
      include-message: always

server:
  port: 9990

vance:
  # Build stamp — filled by Maven resource filtering (@…@ delimiter, enabled by
  # spring-boot-starter-parent) from the reactor version, so brain reports the
  # real release at runtime instead of a hardcoded string. Consumed by
  # ClusterService, GeocodeService, ProfileController and the WS welcome below.
  # Falls back to 'dev' / empty on an unfiltered classpath (rare, e.g. raw IDE
  # resources without a Maven build).
  build:
    version: @project.version@
    time: @build.timestamp@
  language:
    # Final language fallback used when neither chat.language /
    # content.language nor any scope setting (project / user / tenant)
    # picks a language. Built-in default 'en'; local installations can
    # set this to 'de' (etc.) to default the assistant + content
    # language without touching per-user settings. Does NOT affect the
    # find*Language() "no opinion" paths, which still return null.
    default: en
  net:
    ssrf:
      # SSRF egress guard escape hatch. Default false: web_fetch / doc_import_url
      # / link-preview / llms.txt-probe refuse loopback + private/LAN targets so
      # untrusted (LLM/prompt-injected) fetches can't reach internal services or
      # cloud-metadata. Set true ONLY in a local/dev profile to point tools at
      # localhost / a LAN service while testing — it re-opens SSRF and logs a
      # startup warning. Operator config only; never an LLM-controllable flag.
      allow-private: false
      # Production policy for URLs that tenants control (server-tools.md §16).
      # Loopback, link-local (cloud metadata), unspecified, multicast and
      # broadcast are always refused. 'deny' (default): only public addresses.
      # 'allow': private ranges (RFC 1918, CGNAT, ULA) are reachable too — then
      # list in 'denied' what no tenant may reach (cluster networks, DB hosts).
      private-networks: deny
      # Comma-separated CIDR ranges or host names (a string, not a YAML list;
      # env VANCE_NET_SSRF_DENIED). Applies in both modes. Only ranges really
      # protect; a host name is bypassed by using the IP.
      denied: ""
  settings:
    # Setting keys an agent may never write — through a kit install or a tool
    # template, the two LLM-reachable setting-write paths. Applies regardless of
    # the setting's type and regardless of whether it already exists.
    #
    # Without this an agent could create ai.provider.x.apiKey itself as a HIDDEN
    # setting and then read it back through a secret reference, in this session
    # and every later one — turning a transient exposure into a permanent one.
    # Infrastructure credentials are operator territory and get set through
    # setting forms.
    #
    # Comma-separated; each entry is an exact key or a prefix ending in '*'.
    # Operator config only; never an LLM-controllable flag — deliberately a
    # property and not a setting, since an agent with settings write access could
    # otherwise widen its own permissions.
    # See planning/setting-type-hidden.md §6.4 (rule W3).
    # store.* is on the list because it holds the credential and the
    # account identity that decide which kits this installation may
    # fetch — an agent able to rewrite it could redirect a purchase
    # identity (planning/kit-store.md §3 S3).
    # kit.* for the same reason one level down: kit.token.<host> is what a
    # project's kit provisioning fetches with, so an agent able to write it
    # decides where the project gets its tool definitions from. It was in the
    # Java default and missing here, and this file wins — the shipped
    # configuration was the weaker of the two.
    # A mount is no longer a setting — it is a document under
    # _vance/config/mounts/, so the guard for it moved to the document layer
    # (KitRecordStore.isReservedPath for kits, the reserved _vance/ prefix rule
    # for agents). Nothing to deny here any more.
    agent-write-deny-keys: "ai.provider.*,vault.*,store.*,kit.*,ai.llm.budget.*,storage.quota.*,project.quota.*,user.quota.*,team.quota.*"
    # Keys no {{secret:…}} reference may resolve — the read-side counterpart of
    # agentWriteDenyKeys, deliberately a separate list because "may not write"
    # and "may not resolve" are different questions.
    #
    # store.token.* is here but kit.token.* is NOT, and the asymmetry is the
    # point: nothing legitimately references a store token (compiled code reads
    # it at a fixed name through SettingService), while a provisioning document
    # resolves kit.token.<host> through exactly such a reference. Folding the
    # two lists together would break provisioning to close a store leak.
    secret-reference-deny-keys: "ai.provider.*,vault.*,store.token.*"
  kits:
    # Setting keys a kit may not write into a project. Third list of this
    # shape, third question: not an agent and not a reference, but a bundle of
    # files from somewhere else that installs unattended.
    #
    # Same families as agentWriteDenyKeys, for the same reasons — a kit that
    # could set store.account.<sourceId> would rewrite the very value its own
    # licence gate compares the signed licensedTo against. Mounts are documents
    # now and are refused by KitRecordStore.isReservedPath instead. Shorten this
    # in a deployment where kits are trusted to configure providers.
    setting-deny-keys: "ai.provider.*,vault.*,store.*,kit.*"
  jaglan:
    local:
      # Base directories a `protocol: local` mount may point its rootDir at.
      # Comma-separated absolute paths; a mount may name any subtree of one.
      #
      # EMPTY (the default) DISABLES THE local PROTOCOL. rootDir arrives from a
      # project-scoped setting, and the confinement check only answers "inside
      # the rootDir", never "which rootDir" — so without this list a project
      # admin could set rootDir=/ plus writable=true and read/write the brain
      # pod's whole file system, /proc/self/environ included. Operator config
      # only, never a setting, same character as vance.exec.isolation.
      allowed-roots: ""
  fook:
    # Master on/off switch for the Fook feedback/triage subsystem —
    # the vance_support_request LLM tool, the web user-menu feedback
    # modal, the foot /support command, plus triage, session-analysis
    # and upstream forwarding. Default true. Set false to turn all of
    # it off on this brain: the LLM tool stays listed but every call
    # returns a "disabled" note (so the model stops retrying), POST
    # /brain/{tenant}/fook/submit answers 503, and nothing is queued,
    # triaged, analysed, or forwarded upstream.
    enabled: true
  bootstrap:
    # Seed the Acme demo tenant on first start (users, project groups,
    # projects, demo documents, _tenant system project, init-settings
    # YAML import). Set to false for production deployments.
    acme: true
  storage:
    chunk-size: 524288            # 512 KB
    cleanup-interval-ms: 900000   # 15 min
    orphan-sweep:
      # Cluster-master-only periodic orphan-cleanup. Two phases:
      #   1) Archive entries whose lineage has no live document left
      #      (leaked by a crashed DocumentService.delete).
      #   2) Storage blobs older than gracePeriod that no document and
      #      no archive references.
      # Memory stays at O(batchSize) — Mongo cursors stream both passes.
      # See StorageOrphanCleanupService for the write-order / race
      # analysis behind the grace value.
      interval: PT1H
      initial-delay: PT5M
      grace-period: PT1H
      batch-size: 500
  services:
    storage-cleanup: true         # this brain instance runs the cleanup
    magrathea: true                  # workflow subsystem (planning/workflow-service.md)
  magrathea:
    # Deadlines against a run that stops moving. These are nets against
    # DEFECTS, not business deadlines — a workflow with a real deadline
    # writes timeoutSeconds: on the state. See workflows.md §12a.
    #
    # Fires when a state declares no timeoutSeconds:. Split by who is
    # being waited for, because the legitimate waits differ by orders of
    # magnitude. Recoverable — routes outcome: timeout through on:/catch:.
    # A declared 0 opts a state out; a 0 here switches the default off.
    default-agent-timeout: PT2H        # agent_task    — a ThinkProcess
    default-gate-timeout: P7D          # gate_task     — a person
    default-sub-workflow-timeout: PT24H  # workflow_task — a sub-run
    # Backstop behind those: a task non-terminal for this long means the
    # run is stalled, whatever the reason, and it is failed with the full
    # unwind. Deliberately far above the deadlines above — reaching it
    # means they failed too. Master-pod only. 0 switches it off.
    stall-ceiling: P14D
    # How many calls to outside services (tool_task) one project has in flight at once. Such a call
    # runs off the project lane, so a slow one does not hold up the project's other steps; this
    # bounds a burst of runs against one service. A call past the limit waits for a place. 0: no limit.
    max-concurrent-calls: 5
    # How often the watchdog looks. Decides how late a verdict may be,
    # not when it is due — an hour against a 14-day ceiling is nothing.
    watchdog-interval: PT1H
  # WebSocket layer — bound by VanceBrainProperties (prefix vance.ws). These
  # keys previously sat under vance.services by mistake and never bound, so the
  # welcome message silently fell back to the Java defaults. serverVersion now
  # tracks the build version, so connecting clients see the real release.
  ws:
    server-version: ${vance.build.version}
    protocol-version: 1
    ping-interval-seconds: 30
    capabilities: []
  encryption:
    # No insecure default — a missing VANCE_ENCRYPTION_PASSWORD must fail
    # the boot rather than encrypt every secret under a known key (F4).
    password: ${VANCE_ENCRYPTION_PASSWORD}
  web:
    # Browser-reachable base URL for callbacks (e.g. OAuth redirect_uri).
    # Dev default = Vite dev server (proxies /brain/* to this Spring app).
    # In prod, override with the reverse-proxy hostname:
    #   VANCE_WEB_PUBLICBASEURL=https://vance.example.com
    public-base-url: ${VANCE_WEB_PUBLICBASEURL:http://localhost:9900}
    cookies:
      # Default 'false' so the local http://localhost:9900 dev flow works
      # in browsers that strictly honour the Secure flag (Safari rejects
      # Secure-cookies over plain http even on localhost; Chrome is lax
      # and treats localhost as a secure context). Production deployments
      # MUST set this to 'true' — see deployment/mini/k8s/configmap.yaml.
      secure: ${VANCE_WEB_COOKIES_SECURE:false}
    search:
      log:
        # Per-call log document for web_search invocations under
        # _vance/logs/web/search/<isoStamp>-<correlationId>.md.
        # Captures the query + hit list the LLM actually saw — failed
        # calls are NOT logged (errors are visible to the engine in
        # the tool response).
        # Tenant override: setting `web.search.log.retentionDays`
        # (project cascade). Same tri-state semantics as scheduler.log:
        #   > 0  — retention in days (<= 365).
        #   0    — INFINITE (no TTL).
        #   < 0  — DISABLED.
        retention-days: 7
    fetch:
      log:
        # Per-call log document for web_fetch invocations under
        # _vance/logs/web/fetch/<isoStamp>-<correlationId>.md.
        # Captures the truncated body the LLM saw, not the full
        # upstream response. Failed fetches (ToolException) are NOT
        # logged. Tri-state semantics as above; tenant override via
        # `web.fetch.log.retentionDays`.
        retention-days: 7
  internal:
    # Shared secret used by Layer 1 to authenticate against /internal/**
    # endpoints on a peer pod. In K8s this is mounted from a Secret.
    # NEVER expose Layer 2 outside the cluster.
    #
    # No shipped default: a known shared secret would let anyone who reads
    # this file authenticate against /internal/** on any deployment that
    # never set the variable. Empty is the safe fallback — every consumer
    # declares `${vance.internal.token:}` and logs a startup warning, and
    # /internal/** then rejects all callers, which is correct for a
    # single-pod install that has no pod-to-pod traffic. Multi-pod setups
    # MUST set the same value on every pod (dev profiles and the aitest
    # profiles carry their own throwaway token).
    token: ${VANCE_INTERNAL_TOKEN:}
  workspace:
    # Workspace access for tenants on this pod (planning/multi-tenant-isolation.md
    # part 2). 'local' (default): workspace tools, exec jobs and compose as they
    # are. 'off' (shared pods): those access paths are gone — file/exec tools leave
    # the inventory, exec jobs / compose / stdio MCP / r_script / local LaTeX are
    # refused, the WORK target is unavailable — while the mechanics (script library
    # store, node_install) stay. With 'off' the script sandbox self-test must pass
    # fully or the brain does not start. Env: VANCE_WORKSPACE_MODE.
    mode: local
    access:
      bypass-proxy: false
      max-file-size: 10485760       # 10 MiB
      cache-ttl: 30m
      connect-timeout: 2s
      read-timeout: 30s
  exec:
    isolation:
      # OS-isolation for work_exec_run — see specification/public/work-target.md §8.
      # File tools (work_file_*) are ALWAYS confined to their RootDir; a shell
      # command however can read arbitrary paths, so it must be wrapped to be
      # confined too. mode: none (default) runs the command directly under the
      # shell; mode: custom wraps it in the template below so it only sees its
      # RootDir. The brain Docker image ships bubblewrap, so the default wrapper
      # works there once enabled — flip it on per deployment with
      # VANCE_EXEC_ISOLATION_MODE=custom (requires the container runtime to
      # permit unprivileged user namespaces). Operators tune the wrapper for
      # their workload (e.g. drop --unshare-net when exec needs the network).
      mode: ${VANCE_EXEC_ISOLATION_MODE:none}
      # {workdir} = the job's RootDir cwd, {cmd} = the command (one argv element).
      wrapper: >-
        bwrap --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib
        --ro-bind-try /lib64 /lib64 --ro-bind-try /etc/ssl /etc/ssl
        --ro-bind-try /etc/pki /etc/pki --ro-bind-try /etc/crypto-policies /etc/crypto-policies
        --bind {workdir} {workdir} --chdir {workdir}
        --proc /proc --dev /dev --tmpfs /tmp --unshare-net --die-with-parent
        /bin/sh -c {cmd}
      # The same switch for every other starter (npm, pip, ffmpeg, whisper,
      # yt-dlp, latexmk, Rserve) — planning/multi-tenant-isolation.md phase 2c.
      # The starter's argv is appended. {home}/{workdir} are substituted;
      # {ro-binds}/{binds} expand to the paths the starter declares (read /
      # write), {net} to --unshare-net unless it needs the network (registries,
      # downloads, the Rserve port). /tmp is a fresh tmpfs and comes BEFORE the
      # binds, so a declared path under the real /tmp stays visible. On Oracle
      # Linux: /etc/pki holds the CA bundle, /etc/crypto-policies the OpenSSL
      # config node refuses to start without, /etc/alternatives the python3 link.
      # Tested on mickey with the brain image (planning/multi-tenant-isolation.md P18).
      process-wrapper: >-
        bwrap --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib
        --ro-bind-try /lib64 /lib64 --ro-bind-try /etc/ssl /etc/ssl
        --ro-bind-try /etc/pki /etc/pki --ro-bind-try /etc/crypto-policies /etc/crypto-policies
        --ro-bind-try /etc/alternatives /etc/alternatives
        --ro-bind-try /etc/resolv.conf /etc/resolv.conf --ro-bind-try /etc/hosts /etc/hosts
        --ro-bind-try /etc/nsswitch.conf /etc/nsswitch.conf
        --proc /proc --dev /dev --tmpfs /tmp
        {ro-binds} --bind {home} {home} --bind {workdir} {workdir} {binds}
        --chdir {workdir} {net} --die-with-parent
    # Resource caps (prlimit) for the same starters. No defaults. Address space
    # is virtual, not RAM — measured on mickey: npm install needs 2GB, whisper
    # tiny 4GB, whisper small (the default model) 8GB. So e.g.
    # VANCE_EXEC_PROCESS_LIMITS_ADDRESS_SPACE=8GB, ..._CPU_SECONDS=1800,
    # ..._FILE_SIZE=1GB; real memory is bounded by the pod limit. No process-count cap: RLIMIT_NPROC counts the brain's
    # own threads (P16) — use the pod's pids limit.
    process-limits:
      prlimit-path: prlimit
  ai:
    cache:
      # Master switch for Anthropic prompt caching. When false, the
      # AnthropicProvider downgrades every AiChatOptions.cacheBoundary
      # to NONE — every call pays full input price, no cache_control
      # markers go out. Per-recipe override via params.disableCache:true
      # is layered on top (engine-level granularity); set this flag
      # to false for an operator-level kill switch.
      enabled: true
  auto-summary:
    # Per-pod scheduler that runs Jeltz over dirty documents — see
    # planning/auto-summary.md. Feature default is on; opt-out is the
    # per-project `autoSummary.enabled` cascade setting.
    interval-ms: 300000          # 5 min between ticks
    initial-delay-ms: 60000       # 1 min after pod start before first tick
    batch-size: 10               # max documents claimed per project per tick
    claim-ttl-minutes: 10         # stale-claim recovery window
    max-content-bytes: 200000     # prompt-content cap (head + tail truncation)
  documents:
    archive:
      # Document versioning — DocumentService archives the previous
      # version of a document before overwriting it. Cascade:
      # operator switch here → per-project `documents.archive.enabled`
      # cascade setting (default true).
      enabled: true
      # Minimum seconds between two archive entries for the same
      # document. Saves within this window are collapsed onto the
      # previous version — keeps edit-bursts from producing dozens of
      # near-identical archives. Per-project override via the cascade
      # setting `documents.archive.minVersionIntervalSeconds`.
      min-version-interval-seconds: 600   # 10 min
  audit:
    # Delivery mode after @PostConstruct. Before @PostConstruct the
    # service is always SYNC so events emitted during Spring wiring
    # are not lost. `async` decouples producers from consumer cost via
    # a bounded queue; `sync` dispatches inline on the caller thread.
    mode: async
    queue-size: 10000        # bounded — drops + counter when full
    drain-timeout-ms: 5000    # @PreDestroy waits this long for the worker
    consumers:
      log:
        # Activates LogAuditConsumer (every event as SLF4J INFO).
        # Opt-in; keep off in production until the action vocabulary
        # is stable, otherwise log volume balloons.
        enabled: false
  scheduler:
    log:
      # System-wide fallback for the per-run log document retention.
      # Tenant operators override this via the typed setting
      # `scheduler.log.retentionDays` (project cascade: project →
      # _tenant → this default). Reaped by MongoDB's TTL monitor —
      # see DocumentDocument.expiresAt and SchedulerLogService.
      #
      # Tri-state:
      #   > 0  — actual retention in days (clamped to <= 365).
      #   0    — INFINITE: document is written but expiresAt is left
      #          null, so Mongo's TTL monitor never reaps it.
      #   < 0  — DISABLED: no document is written at all.
      retention-days: 7
    # Finest cadence a cron scheduler keeps — seconds | minutes | hours.
    # The YAML a user writes is accepted as written (no error at
    # scheduler_set); only the registered trigger is normalised.
    #   seconds — the cron runs as written, second precision.
    #   minutes — the seconds field is clamped to "0": at most once per
    #             minute. Default; protects the brain from `*/5 * * * * *`.
    #   hours   — seconds clamped to "0" and the minute replaced by a
    #             stable per-scheduler offset (0..59), so at most once per
    #             hour and the fires spread over the hour instead of all
    #             landing on minute 0. A scheduler then does not fire at
    #             an exact minute. Intended for the cloud (load protection).
    granularity: minutes
  events:
    log:
      # Same tri-state semantics as scheduler.log — system-wide fallback
      # retention for the per-trigger log document under
      # _vance/logs/events/<name>/<isoStamp>-<correlationId>.md.
      # Tenant override: setting `events.log.retentionDays` (project
      # cascade).
      #
      #   > 0  — actual retention in days (clamped to <= 365).
      #   0    — INFINITE retention (no TTL set).
      #   < 0  — DISABLED (no document written).
      retention-days: 7
    # Calls per minute an event accepts when it states no rateLimit of its own (token bucket, per pod).
    # The endpoint carries no JWT; this bounds how fast a caller may start runs. 0 = no limit.
    rate-limit-per-minute: 120
    # How long a delivery id is remembered for events that name an idempotencyHeader (per pod).
    idempotency-ttl: PT10M
  session:
    # Max age of a bound session's lastActivityAt (= last heartbeat)
    # before the bind is considered dead. Also drives tryBind's
    # stale-takeover. Default = 4× WS ping (30s), tolerant of one
    # missed ping + jitter.
    bind-stale-after: PT2M
    stale-bind-sweep:
      # Cluster-master-only periodic sweep that releases boundConnectionId
      # on every session whose lastActivityAt is older than bindStaleAfter.
      # Runs as a server-side updateMulti backed by the bound_activity_idx
      # partial index — cost is independent of total session count.
      interval: PT60S
      initial-delay: PT2M
  prak:
    # Side-channel an: Compaction → Prak-Analyzer → Sanitizer → Strength → Promotion → Audit
    side-channel-enabled: true
    # Strength-Tags beim LLM-Replay anwenden (dropt STRENGTH:weak Messages)
    context-filter-enabled: true
    # Schwelle: WEAK=alles behalten, NORMAL=WEAK dropen (default),
    # STRONG=alles unter STRONG dropen
    context-filter-min-strength: NORMAL

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    # Each endpoint needs both exposure AND access in Spring Boot 4 —
    # @ConditionalOnAvailableEndpoint checks both. Default access is
    # NONE (no public read), so we open prometheus explicitly.
    prometheus:
      access: unrestricted
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  metrics:
    tags:
      # Pin every metric with the application name so Prometheus /
      # Grafana queries can scope to vance-brain without colliding
      # with other services that share the cluster's Prometheus
      # (Nimbus pods etc.).
      application: vance-brain
  # Spring Boot 4 split metrics-export out of the actuator default
  # auto-config: PrometheusMetricsExportAutoConfiguration is gated by
  # @ConditionalOnEnabledMetricsExport, which looks at
  # `management.<id>.metrics.export.enabled` (id=prometheus here). The
  # registry+endpoint stay 404 unless we flip it on. See
  # spring-boot-micrometer-metrics-4.0.6/.../OnMetricsExportEnabledCondition.class.
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  file:
    name: vance-brain.log
  level:
    de.mhus.vance: TRACE
