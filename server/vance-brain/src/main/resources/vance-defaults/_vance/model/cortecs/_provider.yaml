displayName: Cortecs (OpenAI-wire gateway)
wireType: openai
authType: api-key

# This sidecar is what makes `cortecs` a usable provider instance: it
# declares the protocol once, so `cortecs:<model>` resolves without an
# `ai.provider.cortecs.type` setting next to the key. AiModelResolver
# reads `wireType` after checking that setting, so a tenant that needs a
# different protocol on this name can still override it.
#
# The chat model documents in this directory mirror the full Cortecs
# catalogue. `./wb models cortecs` pulls api.cortecs.ai/v1/models and
# writes them: new models get a mechanical document (context window,
# output cap, size from the name/parameter heuristic, vision, EUR pricing
# snapshot), existing ones get context, pricing and missing capabilities
# refreshed in place — hand-curated fields and comments (timeouts,
# actionLoopCorrections, measured findings) stay untouched. Models the
# gateway no longer lists are only reported; `--prune` deletes them.
# Runtime discovery ("Discover AI Models", Profile → Actions) still
# writes per-tenant observations to `_vance/model-auto/cortecs/`.
#
# Image models do not appear in /v1/models at all, so the sync never
# sees them — `flux-2-klein-4b.yaml` is the hand-written exception and is
# never reported as stale.
#
# No `maxTools:` here. The value belongs to the endpoint, and we have
# not measured what this gateway enforces; an invented cap would silently
# shrink the tool surface, an absent one lets ObservedToolLimitRegistry
# learn the real limit from the first rejection.
