displayName: Ollama Cloud (ollama.com)
wireType: ollama-cloud
authType: api-key

# Hosted Ollama — same protocol as the local daemon (see ../ollama/), with
# `Authorization: Bearer <apiKey>` against https://ollama.com. The model
# documents in this directory are generated by `./wb models ollama-cloud`
# from /api/tags + /api/show; size, comments and anything else curated by
# hand stays untouched on the next run.
#
# Pricing: Ollama Cloud is a subscription, not a per-token bill. The
# documents declare zero rates so the usage report counts the calls as
# priced instead of as coverage gaps — the real cost is the plan fee.
