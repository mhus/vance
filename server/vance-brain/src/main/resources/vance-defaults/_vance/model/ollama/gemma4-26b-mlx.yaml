wireName: gemma4:26b-mlx
contextWindowTokens: 131072
defaultMaxOutputTokens: 8192
size: LARGE
timeoutSeconds: 600
# Runs locally — no vendor bill. The zero rates are declared rather than
# omitted: a missing `pricing:` block means "price unknown" and is counted
# against the usage report's coverage, which would make every local call
# look like a gap in the invoice. USD so the zero folds into the same
# currency series as everything else instead of opening a second one.
pricing:
  currency: USD
  inputPerMTok: 0.0
  outputPerMTok: 0.0
