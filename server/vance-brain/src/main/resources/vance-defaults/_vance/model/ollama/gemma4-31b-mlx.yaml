wireName: gemma4:31b-mlx
contextWindowTokens: 131072
defaultMaxOutputTokens: 8192
# Local models get the small-tier prompt: it is markedly more directive
# (arthur-prompt.md branches on `tier == "small"` — "every turn ends with
# exactly one arthur_action call, no plain assistant text"), and that is
# what a ~30B model needs. LARGE is for frontier models. Also keeps the
# four local benchmark peers on one prompt branch — gpt-oss:20b was SMALL
# while the others were LARGE, which made that comparison apples to
# oranges.
#
# `size` carries a second effect: PromptDateBlock.autoFor gives SMALL a
# day-granular date block where LARGE gets hours. Accepted here — the
# local models do not need clock precision — but it is why the measured
# LARGE/SMALL delta is not purely a prompt-branch delta.
size: SMALL
timeoutSeconds: 600
# Runs locally — no vendor bill. The zero rates are declared rather than
# omitted: a missing `pricing:` block means "price unknown" and is counted
# against the usage report's coverage, which would make every local call
# look like a gap in the invoice. USD so the zero folds into the same
# currency series as everything else instead of opening a second one.
pricing:
  currency: USD
  inputPerMTok: 0.0
  outputPerMTok: 0.0
