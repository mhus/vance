wireName: qwen3.8:27b-mlx
contextWindowTokens: 262144
defaultMaxOutputTokens: 8192
# Same SMALL-tier call as the local peer family (see qwen3.6-35b.yaml):
# the directive small prompt is what a ~30B model needs, and it keeps
# the local benchmark lanes on one prompt branch (gemma4:31b-mlx,
# muse-glimmer:30b-mlx, qwen3.6:35b are SMALL too).
size: SMALL
capabilities:
- vision
timeoutSeconds: 600
# Wire probe (2026-09-13): unlike qwen3.6:35b, this model emits its
# reasoning in the SEPARATE `reasoning` field of the OpenAI-compatible
# endpoint — content arrives clean, no inline think markup. The
# provider treats that field like every other reasoning-emitting
# model (same path as the GLM-5.3 verda lane), so stripThinkTags
# stays off: enabling it would be a no-op and invite the wrong
# conclusion about this model's wire shape.
stripThinkTags: false
# Runs locally — no vendor bill. Zero rates declared rather than
# omitted: a missing pricing block means "price unknown" and counts
# against the usage report's coverage (see qwen3.6-35b.yaml).
pricing:
  currency: USD
  inputPerMTok: 0.0
  outputPerMTok: 0.0
