contextWindowTokens: 1048576
defaultMaxOutputTokens: 8192
size: SMALL

# DeepSeek V4 via strict OpenAI-compatible proxy (Cortecs) reliably
# answers in prose without the action-tool wrapper. Skip the correction
# rounds: the StructuredActionEngine wraps that prose straight into an
# ANSWER action (see answerActionFromText). 0 = no wasted re-prompts.
actionLoopCorrections: 0

# Cortecs dates the flash variant — the wire name carries the `-0731`
# suffix. The undated `deepseek-v4-flash` is not in the catalog and
# 404s ("NotFoundError: Model not found.").
#
# Rates: Cortecs catalog (api.cortecs.ai/v1/models), snapshot 2026-08-08.
pricing:
  currency: EUR
  inputPerMTok: 0.224
  outputPerMTok: 0.269
  cacheReadPerMTok: 0.056
