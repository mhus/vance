# Cost-optimized sibling of gpt-5.6-sol (text + image in, text out).
# Long-context surcharge: prompts >272k input tokens are billed at 2x
# input / 1.5x output for the whole request — not expressible in the
# flat Pricing record.
contextWindowTokens: 1050000
# Reasoning model — the cap must cover the thinking pass, not just the
# visible answer (see glm-5.2.yaml for the failure mode).
defaultMaxOutputTokens: 32768
size: SMALL
capabilities:
- vision
# NOT 'thinking': the model reasons natively, but /v1/chat/completions
# rejects reasoning_effort together with function tools — and every
# engine turn ships a tool manifest. The bundled quirk rule therefore
# pins reasoning_effort to "none"; advertising THINKING here would let
# a recipe's `thinking: medium` override that and 400 the turn.
# Revisit when Vance speaks /v1/responses. (verified 2026-08-10)
pricing:
  currency: USD
  inputPerMTok: 0.2
  outputPerMTok: 1.2
  cacheReadPerMTok: 0.02
