# Balanced sibling of gpt-5.6-sol (text + image in, text out).
# Long-context surcharge: prompts >272k input tokens are billed at 2x
# input / 1.5x output for the whole request — not expressible in the
# flat Pricing record.
contextWindowTokens: 1050000
defaultMaxOutputTokens: 8192
size: LARGE
capabilities:
- vision
- thinking
pricing:
  currency: USD
  inputPerMTok: 2.0
  outputPerMTok: 12.0
  cacheReadPerMTok: 0.2
