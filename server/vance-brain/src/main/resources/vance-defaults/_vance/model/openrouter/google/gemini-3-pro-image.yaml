# Google Gemini 3 Pro Image ("Nano Banana Pro") via OpenRouter's
# dedicated Image API. Same engine as the bundled
# `gemini/gemini-3-pro-image`, served through the OpenRouter gateway.
#
# Token-based billing ($0.00012/output_image token, google-ai-studio /
# google-vertex) — no flat per-image price, `costPerImage` stays empty.
kind: image
timeoutSeconds: 360
supportedAspectRatios:
- '1:1'
- '2:3'
- '3:2'
- '3:4'
- '4:3'
- '4:5'
- '5:4'
- '9:16'
- '16:9'
- '21:9'
maxPromptChars: 4000
