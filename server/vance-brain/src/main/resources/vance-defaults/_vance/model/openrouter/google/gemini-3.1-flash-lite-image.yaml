# Google Gemini 3.1 Flash Lite Image via OpenRouter's dedicated Image
# API — the cheapest Google image tier on the gateway. Token-based
# billing ($0.00003/output_image token) — no flat per-image price,
# `costPerImage` stays empty.
kind: image
maxInputReferences: 14
timeoutSeconds: 180
supportedAspectRatios:
- '1:1'
- '1:4'
- '1:8'
- '2:3'
- '3:2'
- '3:4'
- '4:1'
- '4:3'
- '4:5'
- '5:4'
- '8:1'
- '9:16'
- '16:9'
- '21:9'
maxPromptChars: 4000
