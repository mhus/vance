# OpenAI gpt-5-image via OpenRouter's dedicated Image API.
# Token-based billing ($0.00004/output_image token) — no flat
# per-image price, `costPerImage` stays empty.
kind: image
maxInputReferences: 16
timeoutSeconds: 360
supportedAspectRatios:
- '1:1'
- '3:2'
- '2:3'
- 'auto'
maxPromptChars: 4000
