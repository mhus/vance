# Agrajag — tool-health diagnostic service engine.
#
# Spawned from AgrajagChecker when a tool error doesn't match a clear
# pattern (UNCLEAR classification). Lives in a per-project
# `_agrajag` system session — never user-facing.
#
# The process stays in the project it diagnoses: the tool surface it
# probes (MCP/REST packs, credentials) and the tool-health document it
# writes are project-scoped. Only the AI configuration is pinned to the
# tenant — see `params.aiScope` below.

description: |
  Tool-health diagnostic service engine. Triggered when the synchronous
  AgrajagChecker cannot classify a tool error from patterns. Investigates
  the failure, probes the tool with safe read-only calls if helpful,
  and writes a structured diagnosis into the tool-health document.
engine: agrajag
category: service

# Engine roles — the manifest builder uses these to expose Agrajag-only
# tools (probe, health-write) that other engines can't see.
roles:
  - tool-prober
  - tool-health-writer
  - tool-health-reader

params:
  model: default:agrajag,default:fast
  maxIterations: 3
  # Maximum number of probe calls Agrajag may issue per diagnostic turn.
  # Enforced engine-side to keep diagnosis bounded.
  maxProbes: 3
  # Resolve model, provider instance, API key and base URL exclusively
  # from the `_tenant` layer — never from the diagnosed project.
  #
  # Two reasons. (1) Agrajag's output is control-data: it marks tools
  # UNAVAILABLE and sets cooldowns that gate other users' processes, and
  # it needs reliable tool-calling to do so. That decision must not
  # depend on whichever model a project happens to be experimenting
  # with. (2) Model name and endpoint are separate cascade lookups, so a
  # project that overrides only `ai.provider.<instance>.baseUrl` would
  # otherwise get the tenant's model sent to the project's endpoint.
  # Pinning makes both come from one layer by construction.
  aiScope: tenant

# No promptPrefix on purpose: Agrajag's system prompt is owned by the
# engine (AgrajagEngine.SYSTEM_PROMPT), which drives a fixed probe /
# diagnose loop with a strict output schema. A recipe-level prompt would
# be stored on the process but never read — dead configuration.

tags:
  - service
  - tool-health
  - diagnostic
