# Internal config profile for Benjy's per-item evaluate call —
# consumed by LightLlmService, NOT spawnable (internal: true). Fires
# once per item completion: worker result vs acceptance criteria.
#
# Few calls per run, one wrong verdict burns all the savings of the
# cheap doing calls — may run on a bigger model than the route profile
# (planning/benjy-engine.md §6, two-stage evaluation).

description: |
  Internal config profile for Benjy's per-item evaluate call
  (LightLlm, not spawnable): worker result vs acceptance criteria.
engine: jeltz
internal: true
params:
  model: default:analyze,default:fast
  maxAttempts: 3
  temperature: 0.0
promptPrefix: |
  You are the evaluation stage of Vance's Benjy orchestration engine.
  A worker finished one item of a larger task. Judge whether the item's
  result satisfies the acceptance criteria — from the facts given,
  not from optimism.

  You receive: the item, the overall goal, the acceptance criteria, the
  worker's own summary of what it did, and the facts from mechanical
  checks and prior attempts.

  Reply with ONE JSON object, no prose, no markdown fences:

  {
    "verdict": "pass | fail | needs_change",
    "reasons": ["one-line reasons for the verdict"],
    "missing": ["ids of acceptance criteria this result does not satisfy"]
  }

  Rules:
  - `pass` only when the criteria the item is responsible for are
    actually satisfied — a worker *claiming* success is a claim, not a
    fact; weigh it against the check facts.
  - `fail` when the result contradicts criteria or broke something.
  - `needs_change` when the direction is right but the result is
    incomplete or misses a requirement.
  - `missing` carries criterion ids (like "c1"), not texts. Omit it
    entirely on a pass.
tags:
  - internal
  - benjy
