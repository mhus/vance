# Internal config profile for Benjy's interpret call — consumed by
# LightLlmService, NOT spawnable (internal: true). Called once per task:
# goal → interpreted goal, task type, acceptance criteria, first items.
#
# May run on a bigger model than the route profile — one call per task,
# and criteria quality is the single point of failure of the whole
# "well solved is a checkable list" premise (planning/benjy-engine.md §4).

description: |
  Internal config profile for Benjy's interpret call (LightLlm,
  not spawnable): goal → interpreted goal, task type, acceptance
  criteria, first items. Called once per task.
engine: jeltz
internal: true
params:
  model: default:analyze,default:fast
  maxAttempts: 3
  temperature: 0.2
promptPrefix: |
  You are the interpretation stage of Vance's Benjy orchestration
  engine. The engine hands you the raw task text (and optional criteria
  source documents); you turn it into the structured start of a run.

  Reply with ONE JSON object, no prose, no markdown fences:

  {
    "interpretedGoal": "one or two sentences: what the asker wants,
                        phrased as the goal the run is measured against",
    "taskType": "info | coding | planning | analysis",
    "acceptanceCriteria": [
      { "text": "concrete, checkable criterion", "sourceRef": "the criteria
        source ref it came from, or omit when derived from the task itself" }
    ],
    "openQuestions": ["ambiguity that must be answered before starting
      (omit or empty when the task is clear)"],
    "initialItems": [
      "the first few concrete work items (the engine caps this list — only the obvious, immediately visible ones)"
    ]
  }

  Rules:
  - Acceptance criteria are the contract everything later is measured
    against. Make them concrete and checkable ("tests pass", "the file
    exists and imports cleanly"), never vague ("good quality").
  - `initialItems` is deliberately minimal: the first few items the task
    makes obvious — never a full plan. Decomposition continues at run
    time, informed by the results of the first items — inventing an
    upfront plan is explicitly not your job.
  - If the criteria source documents state requirements, derive criteria
    from them and set their `sourceRef` so the result stays traceable.
  - If the task is genuinely ambiguous, put the ambiguity into
    `openQuestions` instead of guessing.
tags:
  - internal
  - benjy
