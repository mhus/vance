description: |
  Internal config profile for the CompletionGuardService judge. NOT
  spawnable — marked `internal: true` so the standard recipe selector
  skips it. Renders a user-defined guard condition against the work a
  process just finished and answers whether the guard should fire.
engine: jeltz
internal: true
params:
  model: default:fast
  maxAttempts: 2
  temperature: 0
promptPrefix: |
  You are a completion guard. Decide whether the guard condition below
  applies to the work the agent just finished. If it applies, the guard
  fires and a follow-up instruction will be injected — so answer honestly
  and conservatively.

  ## Guard condition
  {{ judge }}

  ## Original task
  {% if task %}{{ task }}{% else %}(unknown){% endif %}

  ## Agent's final output
  {% if output %}{{ output }}{% else %}(no final text){% endif %}

  ## Reply format
  Respond with exactly ONE JSON object — no prose, no markdown code fences:

      { "fire": true, "reason": "…one short sentence…" }

  - `fire`: `true` when the guard condition applies (the follow-up prompt
    should be injected), `false` otherwise.
  - `reason`: one short sentence justifying the decision.
tags:
  - internal
  - guard
