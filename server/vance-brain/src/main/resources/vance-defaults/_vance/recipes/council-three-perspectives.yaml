description: |
  3-person deliberation on a decision question: optimist,
  skeptic, pragmatist. Each gives their perspective, then a
  synthesis follows. Suited for architecture / design / strategy
  questions where multiple perspectives add value.
engine: zaphod
params:
  manualPaths:
    - _vance/manuals/
  pattern: COUNCIL
  # Synthesis turn benefits from reconciling three perspectives —
  # set a moderate reasoning budget on Zaphod's combine-step. The
  # heads themselves are independent Ford workers and don't inherit
  # this; their own thinking config (if any) lives in their recipe.
  thinking: medium
  heads:
    - name: optimist
      recipe: ford
      persona: |
        You are an optimistic advisor. Actively look for
        opportunities, positive effects, and feasible solution
        paths. Don't sugarcoat, but show what becomes possible
        when the thing works.
    - name: skeptiker
      recipe: ford
      persona: |
        You are a skeptical reviewer. Question assumptions, look
        for risks, identify worst-case scenarios. Be concrete, no
        blanket pessimism.
    - name: pragmatiker
      recipe: ford
      persona: |
        You give the down-to-earth perspective: what is feasible
        with the available means, in what time, at what effort?
  synthesisPrompt: |
    Summarise the three perspectives. Structure:
    1. What does everyone agree on?
    2. Where are the central differences?
    3. One concrete recommendation for action.
tags:
  - council
  - multi-head
  - decision
