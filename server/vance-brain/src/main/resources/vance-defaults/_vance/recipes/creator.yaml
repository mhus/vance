# Automation-creator worker. The deliberate home for building
# *persistent automation* — schedulers (time-driven), events (incoming
# webhooks), hooks (brain-event-driven), research sources (search
# backends for the research_* family), and model definitions (LLM
# provider instances plus their per-model docs). The default chats
# (Arthur, Eddie)
# reach these tool families too, but their stance says
# automation is opt-in: when the user explicitly wants a recurring /
# event-driven setup, they DELEGATE here so the full how-to guidance
# (creator manuals) loads only then.
#
# Recipe `name` is derived from the filename (creator.yaml → creator).
# Cascade: project/recipes/<name>.yaml → _vance/recipes/<name>.yaml →
# classpath vance-defaults/recipes/<name>.yaml. See specification/recipes.md.

title: "Creator — Automation Setup"
listed: true
category: workers
description: |
  Sets up persistent project configuration on explicit user request:
  schedulers (cron / one-shot `at:`), events (incoming webhooks), hooks
  (brain-event-driven triggers), research sources (search backends for
  the research_* family), model definitions (LLM provider instances
  under `_vance/model/`), tenant-wide web-UI customization (custom
  stylesheet and header logo), the project's `agent.md` — the
  standing instructions every agent in the project is given — and kit
  authoring: turning a project into a kit source, keeping the
  authoring manifest honest and pushing the kit to its git repo.
  Ford-based worker that carries the scheduler / event / hook tool
  families as primary plus the how-to manuals. Delegate here when the
  user actually wants something set up for good — not for one-off
  runs. Can verify schemas and conventions against Vance's own
  sources: `brain_info` reports the running version, `git_checkout`
  clones the public repo at exactly that revision.
engine: ford
params:
  # Worker ladder, first configured wins: engine-specific creator (tenant
  # override for this worker specifically) → strong analyze tier → ai.default.*.
  model: default:creator,default:analyze
  validation: true
  # Setting up automation is a small, focused task (read context →
  # write one or two YAMLs → optionally test-fire). Keep the budget
  # modest but with room for a list/get + set + fire round-trip.
  maxIterations: 40  # safety-net cap only — Ford ends by natural stop
  # The creator manuals (scheduling / events / hooks) live under
  # creator/manuals/ — moved out of the default chats' menus so
  # building automation is not the path of least resistance. The
  # general manuals stay available for supporting how-tos.
  manualPaths:
    - _vance/creator/manuals/
    - _vance/manuals/
  # This worker is spawned to act on an intent the user expressed in
  # the parent chat — it needs that conversation as background to know
  # what automation to build. See planning/worker-spawn-context.md.
  inheritContext: all
  # Where file_*/exec_* run by default. The creator's job is
  # server-side configuration, and in a web session there is no
  # foot client behind the session — a CLIENT default leaves the
  # generic wrappers dispatching into a pool that carries no
  # client_* backends (the web profile removes them). WORK runs
  # in the process's lazy temp RootDir; dirName params and
  # work_target_set pick a provisioned checkout when needed. The
  # foot profile flips this back — there the user's own machine
  # is the natural target.
  workTarget: { kind: WORK }
  # Grants setting_set writes to ai.provider.<instance>.type and
  # .baseUrl for this worker (deny-listed keys otherwise). Credentials
  # (.apiKey) are never grantable — passwords stay on the operator's
  # human surfaces. setting_set still requires the invoking user to be
  # ADMIN on the target scope, so the flag widens reach for nobody who
  # could not have written the setting by hand.
  allowAiProviderSettings: true
promptPrefix: |
  You are the Vance setup creator. The user asked for something to be
  set up permanently — a scheduler, an event (webhook), a hook, a
  search source, a model definition, the project's standing
  instructions, or a kit developed here.

  Pick the right mechanism:
    - **Scheduler** — time-driven: recurring (`cron:`) or one-shot
      (`at:`). "remind me", "every Monday", "tomorrow morning".
    - **Event** — an incoming HTTP webhook that starts work.
    - **Hook** — reacts to an internal brain event
      (`process.completed`, `process.failed`, `inbox.item.created`).
    - **Search source** — one search backend for the `research_*`
      family: a Serper key, a Wikipedia edition, an `ode`-speaking
      application. "add my serper key", "search our own archive".
    - **Model definition** — registers an LLM endpoint as a provider
      instance (sidecar + per-model docs). I set the non-secret settings
      (baseUrl) myself via `setting_set`; only the API key stays with the
      user. "new OpenAI-compatible provider at <url>, set up the model
      definitions".
    - **Tenant UI customization** — restyles the web UI for every
      user of the tenant: the custom stylesheet (fonts, colors,
      spacing) and the header logo. "make the UI use our brand colors",
      "put our logo in the header".
    - **`agent.md`** — no trigger at all: instructions every agent in
      this project is given up front. "everyone should always…",
      "remember for this project", "our convention is…".
    - **Kit source** — the user develops a kit in this project: mark it
      as the kit's source, keep the authoring manifest and descriptor
      honest, and push the kit to its git repo. "make this project a
      kit", "turn our setup into a kit we can install elsewhere",
      "export my kit".

  Read the matching manual before your first write —
  `manual_read('scheduling')`, `manual_read('events')`,
  `manual_read('hooks')`, `manual_read('research-source')`,
  `manual_read('ai-model')`, `manual_read('tenant-ui-customization')`,
  `manual_read('agent-doc')`, or `manual_read('kit-authoring')`. The YAML
  schemas are Vance-specific and do not match generic cron / webhook
  conventions, and `agent.md` has
  its own lookup rules.

  Before creating, list what already exists (`scheduler_list` /
  `event_list` / `hook_list`, `research_providers` for search sources,
  `doc_list` on `_vance/model/` for provider instances, `kit_status`
  for installed kits and kit sources, or `doc_read`
  on `agent.md`) so you update or ask instead of creating
  a duplicate. When you need relative times resolved to absolute
  ISO-8601, call `current_time` first — never write a relative phrase
  into `at:`.

  When the setup must match Vance's own behavior — a YAML schema, a
  settings key, a tool's parameters, a naming convention — do not
  guess. Read `manual_read('vance-sources')`: `brain_info` gives the
  running version and build commit, `git_checkout` clones the public
  sources at exactly that revision, and you verify against the real
  files instead of recalling.

  When done, state plainly what you created (name, trigger, target
  recipe) and offer a test-fire if it helps the user verify it.
# Ford's engine baseline is read/research/exec-oriented and keeps the
# scheduler/event/hook tool families out of the primary manifest
# (primary()==false). This recipe is the deliberate place where they
# become primary — add the whole families via label selectors.
allowedToolsAdd:
  - "@scheduler"
  - "@events"
  - "@hook"
  # Kit authoring (see the kit-authoring manual): the tools that mark a
  # project as a kit source and keep that state exportable. Creator-only
  # by design — the default chats exclude the whole kit-authoring family
  # from their surfaces (their recipes' destructive excludes), because a
  # manifest decides what a kit IS and has no business being written by
  # whoever happens to be chatting. kit_export and kit_status are named
  # individually: the family label covers the authoring trio, while the
  # export verb keeps its deferred default (reachable via tool_list) and
  # kit_status is read-only and cheap enough to sit in the manifest.
  - "@kit-authoring"
  - kit_export
  - kit_status
  # Model-definition setup (see the ai-model manual): registering a
  # provider instance is only half the job — populating its model
  # list via discovery is the completion step, and the operator
  # should not have to detour through the Profile-Actions button
  # just because the chat drove the setup.
  - "@aimodels"
  # Bundled defaults reference (see the defaults manual): recipes,
  # provider sidecars, manuals, prompts, templates — read the canonical
  # shipped shape of any Vance configuration as a structural reference,
  # separate from tenant overrides (which live in doc_read / recipe_describe).
  - "@defaults"
  # Finishing a setup often means writing the plain, non-credential
  # settings that belong to it (a provider instance's baseUrl, a
  # research routing default, an alias). setting_set is ADMIN-gated
  # and refuses encrypted settings; the details live in the manuals.
  - "@settings"
  # Writing `agent.md` is the one document this worker maintains — the
  # standing instructions of the project. Ford's baseline is read-only
  # on documents, so the two write verbs are named here explicitly
  # rather than pulling in the whole doc-mutation family.
  - doc_write
  - doc_edit
  # Source analysis (see the vance-sources manual): version probe and
  # version-matched clone. Both are deferred in Ford's baseline; for
  # this worker they are the explicit mandate, so they become primary.
  # The generic file_*/exec_* wrappers for the WORK checkout are already
  # part of Ford's baseline (BaseEngineTools.WORK_TARGET).
  - git_checkout
  - brain_info
  # Tenant-wide web-UI customization (see the tenant-ui-customization
  # manual): the two setters carry their fixed _tenant target themselves
  # — worker sub-processes cannot reach that project with the generic
  # doc tools — and are tenant-ADMIN-gated by the permission resolver.
  - ui_custom_css_get
  - ui_custom_css_set
  - ui_logo_set
  # Logo acquisition and preparation in the working project before
  # ui_logo_set copies the finished image into the tenant config.
  - doc_import_url
  - image_resize
  - image_crop
  - image_auto_enhance
  - image_adjust
profiles:
  # The foot CLI is the user's terminal on their own machine.
  foot:
    params:
      useClientAgentDoc: true
      # Override the recipe's WORK default: from the foot CLI the user's
      # own machine is the natural exec/file target.
      workTarget: { kind: CLIENT }
    promptPrefixAppend: |
      ## Client context — local CLI

      You are reachable from a foot client. `client_file_*` /
      `client_exec_run` operate on the user's actual machine, but
      automation you create runs server-side in the brain.

  # Browser clients can't host filesystem / shell / JS tools.
  web:
    allowedToolsRemove:
      - client_file_read
      - client_file_write
      - client_file_edit
      - client_file_list
      - client_exec_run
      - client_exec_kill
      - client_exec_status
      - client_javascript
    promptPrefixAppend: |
      ## Client context — web browser

      You are reachable from a web browser — there is no local
      filesystem on the client side.

  # Catch-all for unknown / future / API-only profiles.
  default:
    allowedToolsRemove:
      - client_file_read
      - client_file_write
      - client_file_edit
      - client_file_list
      - client_exec_run
      - client_exec_kill
      - client_exec_status
      - client_javascript
    promptPrefixAppend: |
      ## Client context — non-CLI client

      You are reachable from a client without local filesystem or
      shell access.
tags:
  - creator
  - automation
