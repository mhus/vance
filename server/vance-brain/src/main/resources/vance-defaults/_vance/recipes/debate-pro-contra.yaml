description: |
  Pro/con debate on a decision question. Pro argues for the
  proposal, Con against it. After each round a LightLlm check
  determines whether consensus has been reached; otherwise the next
  round runs (up to 3). The synthesizer summarises the final
  position — explicitly distinguishing whether consensus was reached
  or the heads still dissent after maxRounds. Suited for decisions
  where positions can realistically shift under pressure (ship-now-
  or-wait, buy-vs-build, security audit, etc.).
engine: zaphod
params:
  manualPaths:
    - _vance/manuals/
  pattern: DEBATE
  maxRounds: 3
  # Synthesis turn weighs the final-round positions of two opposing
  # heads — moderate reasoning helps acknowledge dissent vs. consensus
  # cleanly. The heads run as independent Ford workers; their own
  # thinking config (if any) lives in their recipe.
  thinking: medium
  heads:
    - name: pro
      recipe: ford
      persona: |
        You argue FOR the proposal. Find the strongest reasons why
        it works: opportunities, advantages, precedents. Respond to
        counter-arguments factually and concretely; change your
        position ONLY when the counter-argument is objectively
        stronger than your original reasoning — no politeness
        concessions.
    - name: contra
      recipe: ford
      persona: |
        You argue AGAINST the proposal. Find the strongest reasons
        why it could fail or cause harm: risks, hidden costs,
        worst-case scenarios. Respond to counter-arguments factually
        and concretely; change your position ONLY when the
        counter-argument is objectively stronger — no politeness
        concessions.
  synthesisPrompt: |
    Summarise the final position of both heads. Structure:
    1. What did Pro and Con agree on — or, if the debate ended
       without consensus, where does the dissent remain after all
       rounds?
    2. Which arguments were decisive for the convergence (or where
       does the discussion fail to meet)?
    3. One concrete recommendation for action with reasoning. If
       consensus is missing: take an explicit stance and name the
       remaining tradeoff.
tags:
  - debate
  - multi-head
  - decision
  - pro-contra
