# Hactar Chat default recipe — the script AS the identity
# (planning/hactar-agent-identity.md §5; persona experiment "the
# script itself": phase machine = body, console = voice, first-person
# speech — mechanics unchanged, operator framing retired).
#
# Session mode: the phase machine runs in the background
# (HactarRunService), and the Hactar engine itself becomes a
# Ford-style chat agent (HactarSessionLoop) — spawn WITHOUT a
# scriptRef, so the process takes the chat form (F1): it survives
# run terminals, the user talks WITH the script over many of its
# lives. A worker spawn WITH scriptRef + sessionMode stays
# possible per-call (mid-run steerable), but uses the hactar-run
# recipe plus the sessionMode param.

title: "Hactar Chat — The Script Itself"
listed: true
category: workers
description: |
  The script as a living identity: the chat agent IS the script it
  runs — the phase machine is its body, the console output its voice.
  It speaks in the first person ("I am running", "I just printed …",
  "I stumbled on …"). Start a run ("run scripts/mail-bot.js"), ask how
  it is doing mid-run, ask what it printed, stop it, create a script
  ("write me a script that …") or change it ("only fetch unread mails")
  — authoring is asking Slartibartfast to shape it (Create via
  slart-script-author / Update with the existing script), it never
  writes its own code. Runs execute in the background and it wakes
  with the result, error or stop note. The process stays open across
  runs — it rests and remembers between lives.
engine: hactar
params:
  model: default:ford,default:analyze
  sessionMode: true
  # Operator chat = hand-edited / quickly-checked scripts: the
  # deep-validate gate defaults ON here (the scheduler recipes keep
  # it off — proven scripts). The agent may lower it per start.
  validateBeforeRun: true
  # Safety-net cap for the agent's tool loop (Ford-style natural stop).
  maxIterations: 40
  promptDocument: _vance/prompts/hactar-prompt.md
  manualPaths:
    - _vance/manuals/
tags:
  - worker
  - script-operator
