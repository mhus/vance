# Hactar Chat default recipe — the script operator identity
# (planning/hactar-agent-identity.md §5).
#
# Session mode: the phase machine runs in the background
# (HactarRunService), and the Hactar engine itself becomes a
# Ford-style chat agent (HactarSessionLoop) — spawn WITHOUT a
# scriptRef, so the process takes the chat form (F1): it survives
# run terminals, the user operates it conversationally over many
# scripts. A worker spawn WITH scriptRef + sessionMode stays
# possible per-call (mid-run steerable), but uses the hactar-run
# recipe plus the sessionMode param.

title: "Hactar Chat — Script Operator"
listed: true
category: workers
description: |
  Conversational script operator: an identity over Hactar's phase
  machine. Ask it to run a script ("run scripts/mail-bot.js"), to show
  or summarize one, to report mid-run progress ("how is it going?"),
  to create a script ("write me a script that …") or to change one
  ("only fetch unread mails") — authoring (creating AND changing) is
  delegated to Slartibartfast (Create via slart-script-author / Update
  with the existing script), the agent never writes script code itself.
  Runs execute in the background and the agent wakes with the result,
  error or stop note. Stop, adjust, re-run — the process stays open
  across runs.
engine: hactar
params:
  model: default:ford,default:analyze
  sessionMode: true
  # Operator chat = hand-edited / quickly-checked scripts: the
  # deep-validate gate defaults ON here (the scheduler recipes keep
  # it off — proven scripts). The agent may lower it per start.
  validateBeforeRun: true
  # Safety-net cap for the agent's tool loop (Ford-style natural stop).
  maxIterations: 40
  promptDocument: _vance/prompts/hactar-prompt.md
  manualPaths:
    - _vance/manuals/
tags:
  - worker
  - script-operator
