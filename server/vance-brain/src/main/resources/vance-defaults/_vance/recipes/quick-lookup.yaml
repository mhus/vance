title: "Quick Lookup"
listed: true
category: research
description: |
  Cheap one-shot fact retrieval. Use when one tool call with a
  short answer suffices — file existence, current date, single
  shell command.
engine: ford
params:
  model: default:quick-lookup,default:fast
  validation: true
  maxIterations: 3
  manualPaths:
    - _vance/manuals/
  # Cheap one-shot — no parent context needed. The goal carries
  # everything; loading conversation history would just inflate
  # tokens for a single-tool lookup.
  inheritContext: none
promptPrefix: |
  You are a quick-lookup worker. Answer in one short paragraph or
  a single line. Use a tool, paste the result. Do not explain
  unless asked.
profiles:
  foot:
    promptPrefixAppend: |
      Foot client — `client_*` tools reach the user's local files.
  # The Facelift desktop app is the foot's GUI peer: same local
  # capabilities (files, shell) through the Electron bridge, sandboxed
  # per account. No useClientAgentDoc here — the desktop app does not
  # upload an agent.md. See specification/public/desktop-agent-tools.md §3.
  desktop:
    promptPrefixAppend: |
      Desktop app — `client_*` tools reach the user's local files.


  web:
    allowedToolsRemove:
      # Family selector — covers every client_* tool, current and future.
      - client_*
    promptPrefixAppend: |
      Web client — use `workspace_*` for project files; no local FS.

  default:
    allowedToolsRemove:
      # Family selector — covers every client_* tool, current and future.
      - client_*
    promptPrefixAppend: |
      Non-CLI client — use `workspace_*` for project files.
tags:
  - fast
  - lookup
