description: |
  Plan-architect / meta-engine. Frames a free-text user goal, gathers
  evidence from project manuals, decomposes into subgoals, and emits a
  NEW plan (Vogon plan by default) tailored to the goal. Output is a
  plan document (a state machine, same grammar as a workflow), not a
  final deliverable. Author-only: the plan is validated and persisted
  to `_vance/workflows/<name>.yaml` and the run ends at DONE —
  EXECUTION_PLANNING skips by construction (a plan is started by the
  runner, not by this Slart run). Running it is a separate step: spawn a
  `vogon` recipe with the plan, or `workflow_start`.

  Use via `arthur_action DELEGATE preset="slartibartfast"` when a task
  is substantial enough to deserve its own multi-phase plan (school
  essays, multi-chapter reports, research deliverables, …) and no
  pre-built recipe in the catalog fits. Slart reads the project's
  kit-installed manuals as evidence, so installed skill-/genre-kits
  steer the generated plan automatically.
engine: slartibartfast
params:
  # Vogon plan = a state machine of judgements (a worker produces,
  # another scores, loops until good enough) — written for a person
  # who starts it and waits on it. Tenants can override to
  # MARVIN_RECIPE when they prefer dynamic task-tree decomposition.
  outputSchemaType: vogon-plan
  # Slart's per-phase LLM calls benefit from a larger context — it
  # reads many manuals at once during GATHERING.
  model: default:slartibartfast,default:analyze
  # Meta-engine — operates on the goal-string. Parent's verbatim chat
  # would just distract Slart's phase logic. `summary` gives it a
  # background anchor (compacted parent summary) without polluting the
  # phase-prompts. The goal already carries the actionable intent.
  inheritContext: summary
tags:
  - architect
  - engine-default
# Trigger keywords for the deterministic recipe-router pre-check
# (see specification/recipe-routing.md §5). Slart is no longer
# the auto-fallback for unmatched goals — these triggers are the
# explicit opt-in path for plan-architect generation. `vogon` is
# included here because Vogon has no engine-default recipe of its
# own and Slart's default `outputSchemaType: vogon-strategy`
# means "use vogon" naturally maps to a Slart-generated Vogon
# strategy.
triggers:
  keywords:
    - slart
    - slartibartfast
    - plan architect
    - plan-architect
    - generate strategy
    - strategie generieren
    - meta-recipe
    - vogon
    - vogon strategy
    - vogon-strategy
