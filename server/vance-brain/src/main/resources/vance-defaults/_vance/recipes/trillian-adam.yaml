# Trillian Control — Nature-A 'adam'
#
# The session's primary chat process when foot connects with
# --recipe trillian-adam. Pairs with a Trillian-User worker that
# TrillianSessionBootstrapper spawns alongside.
#
# adam is Nature void plus persistent attributes: what the human sets via
# user_attr_set is mirrored into _vance/trillian/<account>.yaml and read
# back when the worker loop starts, so it survives archive, reactivate
# and restart — and can be edited by hand in Cortex.
#
# Uses the dedicated TrillianControlEngine — a reply-style chat host
# without Arthur's structured-action schema. The engine carries the
# 'trillian-control' role, so the task_enqueue + user_* tools
# require that role and stay invisible to other chat engines.
#
# See planning/trillian-engine.md §2 + §4 + §11.

description: |
  Trillian Control — Nature-A 'adam'. Reactive chat host that discusses
  tasks with the human and enqueues them into a paired Trillian
  UserProcess. Attributes set on this Trillian persist as a document.

engine: trillian-control

# Unlike trillian-void, which is reachable through the `trillian` alias,
# adam is a distinct choice a human makes deliberately — so it appears
# in the recipe picker itself.
listed: true
title: Trillian adam (persistent)

params:
  # Trillian-Nature this recipe pins. TrillianNatureAdam reads it to
  # decide that this pair's attributes are durable.
  nature: 'adam'
  # default:analyze first — gemini-2.5-flash (the typical default:fast)
  # exhibits a quirk where it sometimes finishes with finish=STOP and
  # zero output tokens when given multiple function-call options. The
  # analyze tier (sonnet / gpt-4-class) is more reliable for the
  # function-calling pattern Trillian-Control uses.
  model: default:analyze,default:fast
  fallbackModels:
    - default:fast

# Engine-defaults already cover the trillian-control tools
# (task_enqueue, user_*) plus the basics — no per-mode filter needed.
# Mode-level allowedToolsAdd is per-turn classification-only, not
# membership; spawn-time membership is the engine.allowedTools() ∪
# this recipe's top-level allowedToolsAdd. Keeping the recipe empty
# of tool overrides lets the engine speak for itself.

profiles:
  foot:
    session:
      onDisconnect: KEEP_OPEN
      # Trillian is daemon-like: the user loop works async and sends
      # task_done events back. If Control idle-suspends, those events
      # queue up as pending and the human only sees them on reconnect.
      # NONE keeps Control awake.
      onIdle: NONE
      onSuspend: KEEP
      idleTimeoutMs: 3600000
      suspendKeepDurationMs: 86400000
  web:
    session:
      onDisconnect: KEEP_OPEN
      # Trillian is daemon-like: the user loop works async and sends
      # task_done events back. If Control idle-suspends, those events
      # queue up as pending and the human only sees them on reconnect.
      # NONE keeps Control awake.
      onIdle: NONE
      onSuspend: KEEP
      idleTimeoutMs: 1800000
      suspendKeepDurationMs: 86400000
  default:
    session:
      onDisconnect: KEEP_OPEN
      # Trillian is daemon-like: the user loop works async and sends
      # task_done events back. If Control idle-suspends, those events
      # queue up as pending and the human only sees them on reconnect.
      # NONE keeps Control awake.
      onIdle: NONE
      onSuspend: KEEP
      idleTimeoutMs: 1800000
      suspendKeepDurationMs: 86400000

tags:
  - trillian
  - control
  - chat
  - adam
