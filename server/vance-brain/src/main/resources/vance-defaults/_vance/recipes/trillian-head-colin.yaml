# Trillian Head — Nature 'colin'
#
# One conversation process ("head") per discussion thread assigned to
# the Trillian's account. Spawned by TrillianHeadService when a
# contribution lands, woken per contribution via a
# <thread-message> command, concluded with its thread.
#
# Runs the trillian-head engine — Frankie's loop forked into a
# conversational shape (TrillianHeadEngine, the same extend as
# TrillianWorkerEngine) — whose allowedTools() IS the head's surface:
# the thread family, the archive tool, the hub's documents (read and
# write, under the account's WRITER rights), research, and the task
# handover to its own loop for long work. No exec, no process_* or
# inbox_list (the head lives in the loop session next to every other
# head), none of the control-side user_* tools; confined to its hub.
#
# The head's chat log is working memory; the thread is the record.
# The head's reply is its answer: the engine posts it into the thread.
#
# See planning/trillian-exposure.md §3.2.

description: |
  Conversation head — one per discussion thread. Reads contributions,
  answers in the thread, hands long work to the Trillian's loop as a
  task. The counterpart ends the conversation; the head archives only
  when asked to, or when the conversation must close.

engine: trillian-head

# Not listed: heads are never picked by a human — TrillianHeadService
# spawns them by name.
listed: false

params:
  # Standing instructions live under _vance/ — a head is WRITER on the hub
  # and must not be able to rewrite what the loop and its workers obey.
  agentDocument: _vance/trillian/agent.md
  nature: 'colin'
  # Own alias first so a tenant can point heads at a cheaper model
  # than the loop without touching either recipe.
  model: trillian-head-colin:analyze,trillian-colin:analyze,trillian:analyze,default:analyze,default:fast
  fallbackModels:
    - default:fast

# Membership is the engine's (TrillianHeadEngine.allowedTools()); this
# list is classification, not membership: the thread tools are built
# worker-deferred (adam §7.2), and a head's answer channel must be
# primary — a model that has to answer must not find its answer tool
# behind a discovery wall. Same split as trillian-user-adam's thread
# tools.
allowedToolsAdd:
  - thread_get
  - thread_message_add
  - inbox_archive
  - task_enqueue
  # web_search declares itself deferred; a head that researches for its
  # counterpart should not have to discover it first.
  - web_search

# No promptPrefix: the conversation doctrine is the engine's own prompt
# (_vance/prompts/trillian-head-prompt.md, TrillianHeadEngine), and who
# is talking comes from the Nature (persona + headPromptAddendum). A
# colin-specific line belongs in TrillianNatureColin#headPromptAddendum.

tags:
  - trillian
  - head
  - conversation
  - colin
