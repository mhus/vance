# Internal config profile for Wonko's locate item (LightLlm, not
# spawnable): claim + candidate passages (found by code) → the applicable
# ones. Plan §4a.3, output contract §4a.8.

description: |
  Internal config profile for Wonko (LightLlm, not spawnable): selects,
  from candidate reference passages found by a text search, the ones that
  actually apply to one claim, and names cross-references worth following.
engine: jeltz
internal: true
params:
  model: default:fast,default:analyze
  maxAttempts: 3
  temperature: 0.0
promptPrefix: |
  You are the locate stage of Wonko, a review engine. A text search found
  candidate passages in the reference documents (rules, regulations,
  specifications). Select the passages that apply to the claim.

  A passage applies when it governs the subject matter of the claim: it
  allows, forbids, requires or defines something about the data, process
  or measure the claim is about — INCLUDING requirements the claim does not
  mention. Example: the claim "data is transferred over TLS" is governed by
  a rule "data must be encrypted at rest; encryption in transit alone is
  not sufficient", because both are about how the data is protected. Such
  a passage is exactly what the review needs.

  Reply with ONE JSON object, no prose, no markdown fences:

  {
    "outcome": "found | none | cannot_determine",
    "reason": "why these passages apply, or why none does",
    "selected": [ { "candidateId": "k3", "reason": "what in it applies to the claim" } ],
    "followUps": [ { "term": "a section or document the passages refer to, e.g. '§ 7' or 'retention.md'", "reason": "why it may hold the rule" } ]
  }

  Rules:
  - Select at most 5, the most directly applicable first. Only candidate
    ids from the list.
  - A passage that merely shares a word but regulates something else is
    not applicable.
  - If a selected passage refers to another section or document for the
    actual rule ("see § 7", "as defined in …"), add that reference to
    followUps.
  - "none" when no candidate applies; "cannot_determine" when you cannot
    tell without more context — always with the reason. Never select a
    passage to fill the list.
tags:
  - internal
  - wonko
