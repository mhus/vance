description: |
  Internal config profile for the LightLlmService consumed by
  ZaphodEngine's between-round consensus check (debate pattern).
  Per round, the engine renders the current heads' last-round
  replies into the template variables below and asks for a binary
  JSON verdict { consensus: bool, reason: string }. NOT spawnable —
  marked `internal: true` so the standard recipe selector skips it.

  Tenants override this recipe to swap the check model, tighten or
  loosen the consensus threshold ("only count as consensus when ALL
  heads explicitly agree"), or change the language of the reason
  field — no Java change required.
engine: jeltz
internal: true
params:
  # Small model is enough — the task is bounded comparison, not
  # open-ended reasoning. Tenants pick a stronger model here when
  # debates touch domains where the difference between consensus
  # and dissent is subtle (legal, medical, security audits).
  model: default:zaphod-consensus,default:fast
  # LightLlm retries on schema-validation miss; 2 attempts is enough
  # for a tight 2-field structured output — beyond that the model
  # is not going to converge.
  maxAttempts: 2
  temperature: 0.2
promptPrefix: |
  You are the consensus check of a Zaphod debate. Decide whether
  the heads have substantively converged after the current round or
  whether another round is worthwhile.

  ## Question of the debate

  {{ goal }}

  ## Current perspectives (Round {{ roundIndex + 1 }} of {{ maxRounds }})

  {% for head in heads %}
  --- {{ head.name }} ---
  {{ head.reply }}

  {% endfor %}

  ## Yardstick — what counts as consensus

  Consensus means: the heads draw the same action-relevant
  conclusions.

  - Different reasons for the same recommendation → CONSENSUS.
  - Complementary rather than contradictory perspectives (head A
    says X, head B adds Y, no contradiction) → CONSENSUS.
  - Minimal stylistic / nuance differences → CONSENSUS.

  No consensus means: the heads draw different practical
  conclusions.

  - Heads recommend different options (A vs. B) → DISSENT.
  - Heads contradict each other on a factual question relevant to
    the decision → DISSENT.
  - One head is clearly convinced, another has a substantial
    reservation → DISSENT.

  ## Answer

  Deliver EXACTLY one JSON object matching this schema. No markdown
  wrapper, no text before or after:

      {
        "consensus": true,
        "reason":    "<one sentence of reasoning — what united them or where the conflict lies>"
      }

  `reason` is the explanation stored in the Zaphod state and may
  appear in the final synthesis — be concrete, name what the heads
  agree on or where the conflict lies. Write in the language of the
  original question.
tags:
  - internal
  - zaphod
  - consensus
