title:
  de: "Vault — Secret-Manager"
  en: "Vault — Secret Manager"
description:
  de: "Verbindet diesen Scope mit einem externen Secret-Manager. Secrets
       werden nie in Vance gespeichert, sondern zur Laufzeit server-seitig
       aufgelöst und über `{{secret:vault:<key>}}` (Tool-Templates, SMTP,
       REST-Tools) bzw. den `secrets:`-Block in Compose genutzt. Pro Scope
       genau eine Bindung — eine auf User-Ebene gesetzte Bindung gewinnt über
       die Projekt-Bindung, diese über die Tenant-weite `_tenant`-Bindung.
       v1 unterstützt Infisical."
  en: "Binds this scope to an external secret manager. Secrets are never
       stored in Vance — they are resolved server-side at run time and used
       via `{{secret:vault:<key>}}` (tool templates, SMTP, REST tools) or the
       `secrets:` block in Compose. Exactly one binding per scope — a binding
       set at user scope wins over the project binding, which wins over the
       tenant-wide `_tenant` binding. v1 supports Infisical."
icon: key
category: integrations
defaultScope: project
# No availableIn → offered in every scope (user home, regular projects, and the
# _tenant default project) so the full user→project→tenant binding cascade is
# settable from the UI. (availableIn is a glob over the projectId, not a list of
# scope keywords.)

fields:

  # ─── Provider selection ──────────────────────────────────────────

  - name: type
    type: select
    required: true
    defaultValue: "settings"
    label:
      de: "Secret-Manager"
      en: "Secret manager"
    help:
      de: "Welches System die Secrets hält. `Vancetope-Settings` ist der
           Default und braucht keine Konfiguration: `{{secret:vault:<key>}}`
           löst dann gegen Settings vom Typ `hidden` im Projekt-Cascade auf.
           `Infisical` (self-hostbar) hält die Secrets extern — die Referenzen
           in Dokumenten bleiben beim Wechsel gültig, nur die Werte ziehen um."
      en: "Which system holds the secrets. `Vancetope settings` is the default
           and needs no configuration: `{{secret:vault:<key>}}` then resolves
           against `hidden`-typed settings along the project cascade.
           `Infisical` (self-hostable) holds them externally — references in
           documents stay valid across a switch, only the values move."
    bindsTo:
      key: "vault.type"
    choices:
      - value: "settings"
        label:
          de: "Vancetope-Settings (kein externer Manager)"
          en: "Vancetope settings (no external manager)"
      - value: "infisical"
        label: { de: "Infisical", en: "Infisical" }

  # ─── Connection (Infisical only) ─────────────────────────────────
  # None of the fields below carries `required: true`, on purpose: the
  # form validator is unaware of `showIf`, so a required Infisical field
  # would make the form unsavable for the default provider `settings` —
  # the one that needs no connection at all. Their necessity is stated in
  # the help texts and enforced by the provider at resolve time.

  - name: baseUrl
    showIf: "type == 'infisical'"
    type: string
    defaultValue: "https://app.infisical.com"
    label:
      de: "Basis-URL"
      en: "Base URL"
    help:
      de: "Infisical-Endpoint. Für self-hosted die eigene Instanz-URL,
           z.B. `https://vault.example.tld`. Default ist die Infisical-Cloud."
      en: "Infisical endpoint. For self-hosted use your instance URL,
           e.g. `https://vault.example.tld`. Default is Infisical Cloud."
    bindsTo:
      key: "vault.baseUrl"

  - name: project
    showIf: "type == 'infisical'"
    type: string
    label:
      de: "Projekt-ID"
      en: "Project ID"
    help:
      de: "Infisical Project- (Workspace-) ID, aus der Secrets gelesen werden.
           Pflicht, wenn `Infisical` gewählt ist."
      en: "Infisical project (workspace) ID to read secrets from. Required
           when `Infisical` is selected."
    bindsTo:
      key: "vault.project"

  - name: environment
    showIf: "type == 'infisical'"
    type: string
    defaultValue: "prod"
    label:
      de: "Environment"
      en: "Environment"
    help:
      de: "Infisical-Environment-Slug, z.B. `prod`, `staging`, `dev`.
           Pflicht, wenn `Infisical` gewählt ist."
      en: "Infisical environment slug, e.g. `prod`, `staging`, `dev`. Required
           when `Infisical` is selected."
    bindsTo:
      key: "vault.environment"

  - name: path
    showIf: "type == 'infisical'"
    type: string
    defaultValue: "/"
    label:
      de: "Secret-Pfad"
      en: "Secret path"
    help:
      de: "Default-Folder innerhalb des Environments. `/` = Wurzel."
      en: "Default folder within the environment. `/` = root."
    bindsTo:
      key: "vault.path"

  # ─── Machine identity (Universal Auth) ───────────────────────────

  - name: clientId
    showIf: "type == 'infisical'"
    type: string
    label:
      de: "Machine-Identity Client-ID"
      en: "Machine identity client ID"
    help:
      de: "Client-ID der Infisical Machine Identity (Universal Auth). Die
           Identity braucht mindestens Read-Zugriff auf das Projekt/Environment.
           Write-Zugriff nur, wenn Secret-Generierung/-Schreiben genutzt wird.
           Pflicht, wenn `Infisical` gewählt ist."
      en: "Client ID of the Infisical machine identity (Universal Auth). The
           identity needs at least read access to the project/environment.
           Write access only if secret generation/writing is used. Required
           when `Infisical` is selected."
    bindsTo:
      key: "vault.clientId"

  - name: clientSecret
    showIf: "type == 'infisical'"
    type: password
    label:
      de: "Machine-Identity Client-Secret"
      en: "Machine identity client secret"
    help:
      de: "Client-Secret der Machine Identity. Verschlüsselt gespeichert,
           nie zurückgelesen. Leer lassen, um ein bestehendes Secret nicht
           zu überschreiben. Pflicht, wenn `Infisical` gewählt ist."
      en: "Client secret of the machine identity. Stored encrypted, never
           read back. Leave empty to keep an existing secret unchanged.
           Required when `Infisical` is selected."
    bindsTo:
      key: "vault.clientSecret"

settings:
  # Marker key so other code can detect "a vault has been bound at this scope".
  - key: "vault.configured"
    settingType: BOOLEAN
    value: "true"
