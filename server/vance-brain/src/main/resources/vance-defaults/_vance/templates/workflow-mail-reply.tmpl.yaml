$meta:
  kind: vance-workflow

description: |
  Drafts a reply to each unread mail of {{ imapPack }}, asks for approval, and sends it through {{ smtpPack }}.
version: "1"

# Nothing is sent without a person's approval. Each mail waits for it before the next one is looked at, so the
# run takes as long as the person does; mails nobody answers within a day are left alone and stay as they are.
bounds:
  maxWallclockSeconds: 604800
  # About eight tasks per mail.
  maxTaskSpawns: 200

start: list

states:

  list:
    type: tool_task
    tool: {{ imapPack }}__list_messages
    params:
      unread_only: true
      limit: {{ limit | default('5') }}
    storeAs: mails
    retry:
      maxAttempts: 3
      on: [rate_limited, unavailable]
      backoffSeconds: 30
    on:
      success: each
    catch:
      technical_error: failed
      permission_error: failed

  # One pass through the body per mail; the mail is in ${state.mail}.
  each:
    type: for_each_task
    items: "${state.mails.messages}"
    as: mail
    maxItems: 20
    on:
      each: read
      done: done

  read:
    type: tool_task
    tool: {{ imapPack }}__preview_message
    params:
      messageRef: "${state.mail.messageId}"
    storeAs: text
    on:
      success: draft
    catch:
      technical_error: next
      business_error: next

  draft:
    type: agent_task
    recipe: {{ recipe | default('ford') }}
    params:
      prompt: |
        Write a reply to this mail. {{ instructions }}
        Answer with the text of the reply only, no subject line.

        From: ${state.mail.from}
        Subject: ${state.mail.subject}

        ${state.text.body}
    storeAs: draft
    timeoutSeconds: 600
    on:
      success: review
    catch:
      agent_error: next

  review:
    type: gate_task
    inbox:
      kind: APPROVAL
      title: "Send this reply to ${state.mail.from}?"
      body: |
        Subject: Re: ${state.mail.subject}

        ${state.draft}
      criticality: NORMAL
    timeoutSeconds: 86400
    on:
      approved: send
      rejected: next
    catch:
      timeout: next

  send:
    type: tool_task
    tool: {{ smtpPack }}__send_message
    params:
      to: ["${state.mail.from}"]
      subject: "Re: ${state.mail.subject}"
      body: "${state.draft}"
    on:
      success: {% if markSeen %}mark{% else %}next{% endif %}
    catch:
      technical_error: next
      business_error: next
{% if markSeen %}

  mark:
    type: tool_task
    tool: {{ imapPack }}__set_seen
    params:
      messageRef: "${state.mail.messageId}"
      seen: true
    on:
      success: next
    catch:
      technical_error: next
      business_error: next
{% endif %}

  next:
    type: end

  done:
    type: terminal
    outcome: success

  failed:
    type: terminal
    outcome: failure
