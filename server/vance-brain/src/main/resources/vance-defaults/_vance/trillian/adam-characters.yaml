# What a fresh Trillian of Nature-A 'adam' is made of.
#
# Read through the ordinary document cascade, so a tenant or a single
# project can override it: put a file at the same path in _vance or in
# the project and it wins over this one. That is the point of it being a
# document — a tenant that wants German names, or a test project that
# wants deliberately silly ones, changes a file instead of Java.
#
# Read once per minted Trillian, which is rare, so there is no cache:
# an edit takes effect on the next Trillian.
#
# names — A-names, because the Nature is called adam. Arbitrary, but it
#   makes the origin legible: seeing "Ansel" somewhere, one can tell
#   which Nature minted it without looking anything up.
#
#   The gender is stated per name and never derived. Andrea is female in
#   German and male in Italian, Alex is either; a derivation guesses,
#   and guessing wrong here is a small avoidable insult. One column
#   costs nothing.
#
# traits — phrased as how the Trillian works, not how it feels. A trait
#   nobody can act on is decoration, and it is rendered into a prompt on
#   every single turn.

