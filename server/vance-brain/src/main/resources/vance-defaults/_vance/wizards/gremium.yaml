title:
  de: "Gremium anlegen"
  en: "Create a council"
description:
  de: "Persona-Gruppe definieren, die du später zu strategischen Fragen befragen kannst."
  en: "Define a reusable advisory group of personas you can later consult on strategic questions."
icon: users
category: strategie

fields:
  - name: outputName
    type: string
    required: true
    label:
      de: "Name (Dateiname, ohne Leerzeichen)"
      en: "Name (filename, no spaces)"
    help:
      de: "Das Gremium wird unter diesem Namen gespeichert."
      en: "The council is saved under this name."

  - name: purpose
    type: textarea
    rows: 3
    required: true
    label:
      de: "Wozu soll das Gremium beraten?"
      en: "Purpose of the council?"

  - name: members
    type: repeat
    min: 2
    max: 8
    label:
      de: "Mitglieder"
      en: "Members"
    item:
      - name: name
        type: string
        required: true
        label:
          de: "Name"
          en: "Name"
      - name: description
        type: textarea
        rows: 4
        required: true
        label:
          de: "Beschreibung / Rolle / Persona"
          en: "Description / role / persona"

  - name: testQuestion
    type: textarea
    rows: 2
    label:
      de: "Test-Frage (optional — nur ausfüllen, wenn das Gremium sofort laufen soll)"
      en: "Test question (optional — fill in only if the council should run right away)"
    help:
      de: "Leer lassen, um das Gremium nur anzulegen. Mit einer Frage wird es einmal direkt ausgeführt."
      en: "Leave empty to only create the council. With a question, it is run once immediately."

promptTemplate: |
  Use slart to create a council of the following {{ members | length }} people
  that I can consult on strategic questions later.

  Purpose: {{ purpose }}

  Members:
  {% for m in members %}
  - **{{ m.name }}** — {{ m.description }}
  {% endfor %}

  Save it under the name '{{ outputName }}'.
  {% if testQuestion %}After creating it, run it once right away with this first test question: "{{ testQuestion }}".{% else %}Do not run it now — just create the council.{% endif %}
