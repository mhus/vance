$meta:
  kind: vance-workflow

description: |
  Sequential plan: planning → implementation → review, with the person
  asked to approve between the phases. Written to be run by Vogon, so
  the questions reach the conversation it was started from — but there
  is nothing here a headless run could not do, minus being asked.

version: "2"

# Required (specification/public/workflows.md §2): name of the initial
# state — must exist in states:. Without it the parser rejects the
# whole document, which silently killed every waterfall-feature
# spawn once the schema made 'start' mandatory.
start: planning

parameters:
  goal:
    type: string
    required: true
  planningRecipe:
    type: string
    required: false
    default: analyze
  implementationRecipe:
    type: string
    required: false
    default: marvin-worker
  reviewRecipe:
    type: string
    required: false
    default: code-read

bounds:
  maxWallclockSeconds: 86400
  maxTaskSpawns: 40

tags: [plan, waterfall, feature]

states:

  planning:
    type: agent_task
    recipe: ${params.planningRecipe}
    params:
      prompt: |
        Create a plan for: ${params.goal}

        Where relevant, break it down into steps and dependencies.

        Answer to your earlier question (empty on the first run):
        ${state.planning_answer.text}
    storeAs: plan
    on:
      success: approve_plan
      # The agent asked back (or got stuck) instead of planning — its text
      # is a question, not a plan: put it to the person, then plan again
      # with the answer. Approving it as a plan would hand the person a
      # question to sign off.
      needs_input: ask_planning
    catch:
      agent_error: failed
      technical_error: failed

  ask_planning:
    type: gate_task
    inbox:
      kind: FEEDBACK
      title: "The planning agent needs input: ${params.goal}"
      body: "${state.plan}"
      criticality: NORMAL
    storeAs: planning_answer
    on:
      success: planning
    catch:
      timeout: failed

  approve_plan:
    type: gate_task
    inbox:
      kind: APPROVAL
      title: "Plan ready for: ${params.goal}"
      body: "${state.plan}"
      criticality: NORMAL
    on:
      approved: implementation
      rejected: planning
    catch:
      # 'undecidable' was removed from MagratheaErrorKind — the
      # no-answer case of an inbox gate is TIMEOUT, already covered above.
      timeout: failed

  implementation:
    type: agent_task
    recipe: ${params.implementationRecipe}
    params:
      prompt: |
        Implement this plan.

        Plan:
        ${state.plan}

        Answer to your earlier question (empty on the first run):
        ${state.implementation_answer.text}
    storeAs: implementation
    on:
      success: review
      # Same as planning: a question goes to the person, the answer comes
      # back into the next implementation run.
      needs_input: ask_implementation
    catch:
      agent_error: failed
      technical_error: failed

  ask_implementation:
    type: gate_task
    inbox:
      kind: FEEDBACK
      title: "The implementation agent needs input: ${params.goal}"
      body: "${state.implementation}"
      criticality: NORMAL
    storeAs: implementation_answer
    on:
      success: implementation
    catch:
      timeout: failed

  # The review does not just report — it judges, and the plan branches on
  # the judgement. That is the difference between a plan for thinking work
  # and a script that runs three things in order.
  review:
    type: agent_task
    recipe: ${params.reviewRecipe}
    params:
      prompt: |
        Review this implementation against the plan it came from.

        Plan:
        ${state.plan}

        Implementation:
        ${state.implementation}

        Answer with a JSON object: a "score" from 0.0 (unusable) to 1.0
        (complete and correct), a "summary", and an "issues" list.
    score:
      bands:
        - { atLeast: 0.7, outcome: good }
        - { default: true, outcome: weak }
      maxCorrections: 2
    storeAs: review
    on:
      good: accept
      weak: decide_rework
      # A reviewer that asks back or gets stuck is treated like a failed
      # review: the review is advisory, the run does not hinge on it.
      needs_input: accept
    catch:
      agent_error: accept
      technical_error: accept

  decide_rework:
    type: gate_task
    inbox:
      kind: DECISION
      title: "Review found problems — what now?"
      body: "${state.review}"
      options: [rework, accept]
      criticality: NORMAL
    on:
      rework: implementation
      accept: accept
    catch:
      # 'undecidable' was removed from MagratheaErrorKind — the
      # no-answer case of an inbox gate is TIMEOUT, already covered above.
      timeout: failed

  accept:
    type: terminal
    outcome: success
    result:
      goal: "${params.goal}"
      plan: "${state.plan}"
      implementation: "${state.implementation}"
      review: "${state.review}"

  failed:
    type: terminal
    outcome: failure
