vance:
  brain:
    http-base: http://localhost:9990
    ws-base: ws://localhost:9990
  # No baked-in credentials — a bare launch has no dev identity. The stored
  # binding (.vancetope/project.eddie.yaml) or an explicit --config fills these;
  # /login prompts prefill from whatever ends up here, else blank.
  auth:
    tenant: ""
    username: ""
    password: ""
  # Build stamp — filled by Maven resource filtering (@…@ delimiter) from the
  # reactor version. Drives the client handshake version and `--version`.
  # Falls back to 'dev' / empty on an unfiltered classpath.
  build:
    version: @project.version@
    time: @build.timestamp@
  client:
    version: @project.version@
  foot:
    agent:
      # Two size limits for the foot-uploaded agent.md / CLAUDE.md.
      # warn-bytes: file is uploaded as-is, UI shows a warning.
      # truncate-bytes: file is truncated to this length (with a
      # trailing "[truncated]" marker), upload proceeds, UI warns.
      warn-bytes: 100000
      truncate-bytes: 100000
  ui:
    # Side-channel grey/green lines (info, verbose, debug, worker) are
    # truncated to this many characters. Set to 0 to disable.
    line-max-chars: 140
    # Show the model's reasoning ("thoughts") as a dimmed block alongside
    # the answer. Default true. Toggle at runtime with Ctrl+T.
    show-thoughts: true
    # JLine style expressions per output channel. Comma-separated tokens:
    #   fg:<color>  bg:<color>  bold  faint  italic  underline
    #   blink  inverse  conceal  crossed-out
    # color := default | [bright-]{black|red|green|yellow|blue|magenta|cyan|white}
    # Empty = unstyled (terminal default — typically white).
    colors:
      chat: ""
      worker: "fg:green"
      info: "fg:bright-black"
      verbose: "fg:bright-black"
      debug: "fg:bright-black"
      warn: "fg:yellow"
      error: "fg:red"
      # Reasoning / thoughts blocks (dimmed grey side-channel)
      thoughts: "fg:bright-black"
      # Process-progress HUD lines and mode-change hints (dimmed grey)
      dim: "fg:bright-black"
      # Notification toast severity headers
      notify-info: "fg:cyan,bold"
      notify-warn: "fg:yellow,bold"
      notify-error: "fg:red,bold"
      # Plan-proposed and todo box rendering
      plan-border: "fg:cyan,bold"
      plan-content: "fg:cyan"
      plan-dim: "fg:bright-black"
      # Warning boxes (sandbox-disabled, permission-required)
      sandbox-warn: "fg:red,bold"
      permission-warn: "fg:yellow,bold"
      # Status bar
      status-busy: "fg:yellow"
      status-dim: "fg:bright-black,faint"
      status-context: "fg:cyan"
      # Input / prompt area
      user-echo: "inverse"
      completion: "fg:blue"
      ghost-text: "fg:bright-black,faint"
      system-message: "fg:bright-black,faint"
    # Idle-triggered ghost-text follow-up suggestions. When the user
    # hasn't typed for the configured delay and the input is empty, foot
    # asks the brain for a follow-up suggestion and shows it as ghost text.
    # Accept with Right-Arrow or Tab; dismiss by typing.
    follow-up:
      enabled: true
      idle-delay: 3s
  conversation-capture:
    # Append every chat message to .vancetope/conversations/<YYYY>-<MM>/<sessionId>.jsonl
    # Override per-project in .vancetope/config.yaml or with --audit / --no-audit.
    enabled: false
    # Sub-directory under the active .vancetope dir. Default: conversations
    # dir: conversations

logging:
  level:
    root: WARN
    de.mhus.vance: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
